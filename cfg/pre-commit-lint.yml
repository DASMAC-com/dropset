# cspell:word checkmake
# cspell:word Dwarnings
# cspell:word hadolint
# cspell:word mdformat
# cspell:word pygrep
# cspell:word RUSTDOCFLAGS
# cspell:word unspaced
---
repos:
- hooks:
  - args:
    - '--config-file'
    - 'cfg/yamllint.yml'
    - '--strict'
    id: 'yamllint'
  repo: 'https://github.com/adrienverge/yamllint'
  rev: 'v1.38.0'
# cfn-lint validates the CloudFormation templates under infra/aws/. It is
# scoped by `files` so it only parses those templates (not every repo YAML),
# and runs in addition to yamllint, which still enforces house style on them.
- hooks:
  - files: '^infra/aws/.*\.yml$'
    id: 'cfn-lint'
  repo: 'https://github.com/aws-cloudformation/cfn-lint'
  rev: 'v1.53.0'
- hooks:
  - args:
    - '--config'
    - 'cfg/markdownlint.yml'
    # `.claude/shared/` holds prose FRAGMENTS rendered into skill files, not
    # documents, so MD041 (first line must be a top-level heading) does not
    # apply to them. Excluding the directory rather than adding an inline
    # disable comment: the renderer copies a block verbatim, so a directive at
    # the top of a fragment would land inside every skill that includes it.
    # The rendered result is still linted in its destination file.
    exclude: '^\.claude/shared/'
    files: '.(md|mdc)'
    id: 'markdownlint-fix'
    types:
    - 'file'
  repo: 'https://github.com/igorshubovych/markdownlint-cli'
  rev: 'v0.48.0'
- hooks:
  - additional_dependencies:
    - 'mdformat-gfm'
    - 'mdformat-frontmatter'
    - 'mdformat-myst'
    files: '.(md|mdc)'
    id: 'mdformat'
    types:
    - 'file'
  repo: 'https://github.com/hukkin/mdformat'
  rev: '1.0.0'
- hooks:
  - args:
    - '--config'
    - 'cfg/cspell.yml'
    - '--color'
    - '--no-must-find-files'
    id: 'cspell'
  repo: 'https://github.com/streetsidesoftware/cspell-cli'
  rev: 'v10.0.0'
- hooks:
  - id: 'check-added-large-files'
  - id: 'check-case-conflict'
  - id: 'detect-private-key'
  # .rs files are handled by rustfmt. The generated TS tree + the anchor
  # IDL are autogenerated (no trailing newline) and verified by the SDK CI
  # gate, so don't let the fixer fight regeneration.
  - exclude: '(.*.rs|^sdk/ts/src/generated/|^sdk/idl/)'
    id: 'end-of-file-fixer'
  # `--unique` is what heals the dictionary's union merge (see .gitattributes):
  # git takes both sides' lines without sorting or de-duplicating, and the next
  # `make lint` that includes the file restores both. This is a fixer, so it
  # exits non-zero when it rewrites — which is what fails CI on an unsorted
  # dictionary rather than letting one land quietly.
  - args:
    - '--unique'
    files: 'cfg/dictionary.txt'
    id: 'file-contents-sorter'
  - id: 'mixed-line-ending'
  # JSON under frontend/ is handled by biome.
  # `sdk/idl/` is the anchor-generated IDL and `sdk/conformance/` are the
  # generator-emitted conformance vectors — leave both byte-for-byte as
  # their generators emit them so the diff-based freshness CI gates
  # (`make idl`, `make check-conformance-vectors`) stay meaningful.
  # `keys/` holds Solana CLI keypair files — keep them in their
  # canonical single-line byte-array form, not pretty-printed.
  - args:
    - '--autofix'
    exclude: '^(frontend|keys|sdk/(idl|conformance))/|package-lock\.json'
    id: 'pretty-format-json'
  repo: 'https://github.com/pre-commit/pre-commit-hooks'
  rev: 'v6.0.0'
- hooks:
  - id: 'checkmake'
  repo: 'https://github.com/checkmake/checkmake.git'
  rev: 'v0.3.2'
# checkmake lints Makefile structure and hadolint lints Dockerfile structure,
# but neither checks line width. This local pygrep hook enforces the same
# 80-column limit the docs follow (MD013) across both, failing on any line over
# 80 chars (a leading recipe tab counts as one column). Wrap with `\`
# continuations, as the existing multi-line recipes and Dockerfile `COPY`s do.
- hooks:
  - entry: '^.{81,}$'
    files: '(^|/)(Makefile|.*\.mk|Dockerfile|.*\.Dockerfile)$'
    id: 'line-length-80'
    language: 'pygrep'
    name: 'Lines over 80 columns'
  repo: 'local'
# Committed agent material must never name a real machine's home directory —
# two test modules had hardcoded the operator's, which reads machine-specific
# where it should be fixture-driven. The check is on the path's *user segment*,
# not on the shape: a placeholder (`/Users/me`, `/Users/x`) passes, since the
# sibling tools legitimately need home-shaped example paths. Scoped to the
# agent-config trees and the convention docs; the decks are exempt by ruling,
# and fall outside `files` by construction. pre-commit only ever hands it files
# git tracks, so the untracked `settings.local.json` — where a real home path is
# *expected* — is out of reach by the same mechanism that makes it safe to scope
# this broadly.
- hooks:
  - entry: 'python3 .claude/tools/check_home_paths.py'
    files: '^(\.claude/|docs/conventions/|CLAUDE\.md$)'
    id: 'check-home-paths'
    language: 'system'
    name: 'No real home paths in agent material'
    types:
    - 'file'
  repo: 'local'
# Every Rust service in infra/localnet/docker-compose.yml builds with its
# context set to the repo root and its Dockerfile does `COPY . .`, so the root
# `.dockerignore` is the only thing standing between a build and the whole
# checkout — 90.9 GB across 868k files when measured without it. This guard
# asserts the file still names each known-fat tree, and that the effective
# context stays under an order-of-magnitude ceiling (the second catches a new
# fat tree nobody wrote a pattern for, which the first cannot).
#
# `always_run` with `pass_filenames: false` rather than a `files` regex, and
# the distinction is the whole point: pre-commit does not hand a hook the
# files a commit DELETES, so a `files: '^\.dockerignore$'` scoping would go
# quiet in exactly the commit that removes the file. The check is a pruned
# tree-walk that never descends into what it excludes, so it costs
# milliseconds on every run.
- hooks:
  - always_run: true
    entry: 'python3 .claude/tools/docker_context.py'
    id: 'docker-context'
    language: 'system'
    name: 'Docker build context stays bounded'
    pass_filenames: false
  repo: 'local'
# hadolint-py wraps the hadolint binary so the hook needs neither Docker nor
# a manual install. `files` matches `Dockerfile` and `*.Dockerfile` (identify
# doesn't tag the latter as the `dockerfile` type), so `types: file`.
- hooks:
  - files: 'Dockerfile$'
    id: 'hadolint'
    types:
    - 'file'
  repo: 'https://github.com/AleksaC/hadolint-py'
  rev: 'v2.14.0'
# taplo formats every `.toml` to the shared 80-column limit, auto-wrapping
# over-width inline arrays (config in cfg/taplo.toml). The hook pip-installs a
# prebuilt taplo, so it needs neither a Rust build nor Docker. `Cargo.lock` is
# tagged `toml` by identify but is cargo-managed, so leave it untouched.
- hooks:
  - args:
    - '--config'
    - 'cfg/taplo.toml'
    exclude: 'Cargo.lock'
    id: 'taplo'
  repo: 'https://github.com/hoxbro/taplo-pre-commit'
  rev: 'v0.9.3'
- hooks:
  - args:
    - '--fix'
    id: 'ruff-check'
  - id: 'ruff-format'
  repo: 'https://github.com/astral-sh/ruff-pre-commit'
  rev: 'v0.15.18'
# Lint the externalized indexer SQL (indexer/queries/*.sql, loaded by
# store.rs via include_str!). Postgres dialect + `$n` placeholder templater
# are set in cfg/sqlfluff.cfg.
- hooks:
  - args:
    - '--config'
    - 'cfg/sqlfluff.cfg'
    files: '^indexer/queries/.*\.sql$'
    id: 'sqlfluff-lint'
  repo: 'https://github.com/sqlfluff/sqlfluff'
  rev: '4.2.2'
# The Grafana dashboards' SQL, mirrored into market-data/grafana/sql/ so a
# panel's query is reviewable as a diff rather than as a one-character edit
# inside a 1,500-character JSON string. This hook asserts the mirror is current
# and enforces two guards Grafana itself fails SILENTLY on: a nested paren in a
# macro argument (truncated at the first closing paren, so the query never
# interpolates) and a `:regex` template variable inside a single-quoted literal
# (the regex formatter does not escape quotes).
#
# `always_run` with `pass_filenames: false`, for the same reason as
# `docker-context` above: pre-commit does not hand a hook the files a commit
# DELETES, so a `files` regex would go quiet in exactly the commit that removes
# a dashboard and orphans its mirror.
- hooks:
  - always_run: true
    entry: 'python3 .claude/tools/dashboard_sql.py check'
    id: 'dashboard-sql-check'
    language: 'system'
    name: 'Grafana dashboard SQL mirror is current'
    pass_filenames: false
  repo: 'local'
# And lint that mirror as Postgres, after substituting the macros and template
# variables for typed stand-ins. A `local` python hook rather than the sqlfluff
# repo hook above, because the substitution has to happen first and the rule set
# has to be different — cfg/sqlfluff-dashboards.cfg explains why the full set is
# not merely noisy here but unsafe (it objects to the quoted `"time"` and OHLC
# aliases Grafana binds panels to by name).
#
# The version is pinned as a PyPI release while the hook above pins a git tag of
# the same project; `4.2.2` is a tag that has no PyPI counterpart, so the two
# pins are necessarily expressed in different vocabularies rather than kept
# byte-identical.
- hooks:
  - additional_dependencies:
    - 'sqlfluff==4.1.0'
    always_run: true
    entry: 'python .claude/tools/dashboard_sql.py lint'
    id: 'dashboard-sql-lint'
    language: 'python'
    name: 'Grafana dashboard SQL lints as Postgres'
    pass_filenames: false
  repo: 'local'
# shfmt formats and shellcheck lints the committed shell-integration scripts
# under `.claude/scripts/`. Both hooks pip-install a prebuilt binary, so neither
# needs Go nor Docker (matching the taplo / hadolint-py pattern). They are
# scoped to `.claude/scripts/` so the POSIX-sh scripts under `.github/` are left
# byte-for-byte as they are. These are user shell-integration scripts, not skill
# helpers, so bash + shfmt is the deliberate call here (skill helpers stay
# Python per docs/conventions/skill-tooling.md).
- hooks:
  - args:
    - '-w'
    - '-i'
    - '2'
    - '-ci'
    files: '^\.claude/scripts/.*\.sh$'
    id: 'shfmt'
  repo: 'https://github.com/maxwinterstein/shfmt-py'
  rev: 'v3.7.0.1'
- hooks:
  - files: '^\.claude/scripts/.*\.sh$'
    id: 'shellcheck'
  repo: 'https://github.com/shellcheck-py/shellcheck-py'
  rev: 'v0.10.0.1'
# The `rustdoc` hook below is the intra-doc-link gate, and this codebase's
# docs lean heavily on those links. Notes on its shape, since each part was
# a decision:
#
# `RUSTDOCFLAGS` rides an `env` prefix because pre-commit `language: system`
# entries are shlex-split and exec'd directly, with no shell — so a bare
# `RUSTDOCFLAGS=… cargo` prefix would be read as a program name. The same
# splitting is why the flag is written unspaced as `-Dwarnings` rather than
# clippy's `-D warnings` two entries down, which is in turn why `Dwarnings`
# needs a `cspell:word` escape at the top of this file. The variable rides
# the entry rather than the CI job's `env:` so a local `make lint` gates
# identically to the workflow.
#
# `-D warnings` rather than a per-lint list, because the rustdoc link lints
# are three separate ones — `broken_intra_doc_links`,
# `private_intra_doc_links` and `redundant_explicit_links` — and all three
# were live in this tree when the gate landed. It also catches a fourth that
# a toolchain bump might add, which is safe to be strict about because
# `rust-toolchain.toml` pins the compiler, so a bump is always a deliberate
# commit rather than a floating upgrade that could red main.
#
# Default features, NOT `--all-features`: the SDK's `anchor` feature does not
# compile at all (it targets the anchor-next fork — see the SDK publish
# blocker), so `--all-features` fails the doc build on hard resolution errors
# that have nothing to do with links. Accepted cost: a link reachable only
# under a non-default feature goes unchecked.
#
# Second accepted cost, less obvious: without `--document-private-items`,
# rustdoc never builds the docs of private items, so a broken link inside a
# private module's `//!` block cannot warn — verified by planting one. The
# tree is currently clean at BOTH visibilities and the flag is deliberately
# not set, because turning it on makes every public-links-to-private-item
# link resolve and so silences `private_intra_doc_links` — the class that
# was the majority of this gate's first pass. Published docs are built
# without the flag, so those links really are broken for readers. Gating
# both classes needs a second entry and a second full doc build; that cost
# lands on the merge-queue critical path, which is the throughput metric.
#
# On which note: this hook adds roughly one full-workspace doc build to the
# `lint` job. It is close to pure additive wall-clock — `cargo doc` cannot
# reuse the `clippy --all-targets` artifacts in the same job, because the
# two run rustc in different modes. Measure before adding anything else to
# this entry.
#
# This job is also the queue's only reach for this gate: `lint.yml` carries
# no paths-filter and triggers on `pull_request` AND `merge_group`, which is
# what makes the hook cover the merge queue. Adding a paths-filter there
# would silently drop that coverage with nothing going red — the repo has
# been bitten by a `pull_request`-only filter before.
#
# Two authoring rules go with the gate. Neither is fully enforced BY this
# hook, so they are stated here and in `docs/conventions/docs-and-style.md`,
# which is where an author will actually meet them:
#
# 1. A doc comment on an IDL-captured item — an `#[account]` struct, a field
#    of an instruction's `Accounts`, a type the IDL carries — takes a plain
#    code span, never an intra-doc link. Codama copies that text verbatim
#    into `sdk/rs/src/generated/`, where a path that resolves in the program
#    crate resolves to nothing. Note the enforcement is a chain, not this
#    hook alone: `test.yml` regenerates the IDL and diffs it, `sdk.yml`
#    forces the generated trees to match, and only then does this hook see
#    the copied text.
# 2. Never satisfy this gate by widening an item's visibility. Making a
#    private item `pub` makes `private_intra_doc_links` resolve, which in a
#    consensus-critical crate is a trust-surface change made to settle a
#    docs lint. Degrade the link to a code span instead.
- hooks:
  - entry: 'cargo fmt --'
    id: 'rustfmt'
    language: 'system'
    name: 'rustfmt'
    types:
    - 'rust'
  - entry: 'cargo clippy --all-targets -- -D warnings'
    id: 'clippy'
    language: 'system'
    name: 'clippy'
    pass_filenames: false
    types:
    - 'rust'
  - entry: 'env RUSTDOCFLAGS=-Dwarnings cargo doc --no-deps --workspace'
    id: 'rustdoc'
    language: 'system'
    name: 'rustdoc'
    pass_filenames: false
    types:
    - 'rust'
  - entry: 'pnpm -C frontend exec biome check --write'
    id: 'biome'
    language: 'system'
    name: 'biome'
    pass_filenames: false
    types_or:
    - 'css'
    - 'javascript'
    - 'jsx'
    - 'ts'
    - 'tsx'
  - entry: 'pnpm -C frontend exec tsc --noEmit'
    id: 'tsc'
    language: 'system'
    name: 'tsc'
    pass_filenames: false
    types_or:
    - 'ts'
    - 'tsx'
  repo: 'local'
...
