# cspell:word capitalisation
#
# sqlfluff config for the EXTRACTED Grafana dashboard SQL — the mirror under
# market-data/grafana/sql/**, generated by .claude/tools/dashboard_sql.py.
#
# WHY THIS IS SEPARATE FROM cfg/sqlfluff.cfg, AND MUCH NARROWER.
#
# The indexer's queries are hand-written to conform to the full rule set, and
# that config must keep applying to them. This SQL is different in two ways that
# make the same rule set wrong for it, one of them dangerously so.
#
# 1. **Grafana dictates the identifiers.** A time series must alias its time
#    column `AS "time"`, and the candlestick panel maps its series by the column
#    names `"open"`, `"high"`, `"low"` and `"close"`. sqlfluff's RF06 calls every
#    one of those an unnecessary quoted identifier, and RF04 objects to `time`
#    and `close` as keywords. Applying those rules — worse, autofixing them —
#    would rename the columns the panels bind to and silently empty them. The
#    candlestick mapping is already one of this dashboard's known silent-failure
#    modes; a linter must not be a second cause of it.
#
# 2. **The layout is Grafana's, not ours.** These queries are edited in a
#    browser textarea in a 2-space idiom. Enforcing the repo's SQL layout would
#    mean the tool and the editor fighting over every panel, and would produce a
#    large, high-risk diff across SQL whose rendering cannot be verified in CI.
#
# So the rule set here is restricted to findings that indicate a genuine ERROR
# rather than a style preference:
#
#   RF01 — a column references a table or alias that is not in the FROM clause.
#          A real typo catcher, not a style rule.
#   AM01 — DISTINCT combined with GROUP BY, which is always a mistake or a
#          misunderstanding.
#
# Parse (`PRS`) and templating (`TMP`) failures are NOT listed, because they are
# not selectable rules — sqlfluff reports them unconditionally, and listing them
# only produces an "unknown rule reference" warning on every file. They are
# nonetheless the most valuable thing this gate catches, and that it still
# catches them with this narrow allowlist was verified rather than assumed: a
# query with an unclosed bracket fails with `PRS`, and a column against a
# missing alias fails with `RF01`. A panel with unparseable SQL otherwise fails
# at render time, in a browser, visible only to whoever happens to open it.
#
# Layout, capitalisation, and reference-style rules are deliberately absent. If
# a future pass wants the mirror formatted, that is a separate decision with its
# own verification burden, and it needs the panels checked in a browser after.
[sqlfluff]
dialect = postgres
# The mirror is pre-substituted by dashboard_sql.py before it reaches sqlfluff —
# every Grafana macro and template variable is already replaced with a typed
# stand-in — so there is nothing left to template and the raw templater is what
# keeps this deterministic.
templater = raw
rules = RF01,AM01
