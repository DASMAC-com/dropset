---
# cspell:word doctests
# cspell:word dorny
env:
  ANCHOR_REV: '2a191379'
  # Incremental compilation output isn't sccache-cacheable; disable it on CI so
  # every rustc unit is a content-addressable sccache object instead.
  CARGO_INCREMENTAL: '0'
  # Route sccache at GitHub's own Actions cache (no S3/external service).
  SCCACHE_GHA_ENABLED: 'true'
  SOLANA_VERSION: 'v3.1.9'
jobs:
  # Decide whether the changed files can affect the Rust test suite. On a
  # pull_request the filter below marks a PR `code`-relevant unless EVERY
  # touched file lands in a known test-irrelevant tree; a PR that touches only
  # the frontend, docs, or other irrelevant trees skips the build + test work
  # entirely. On merge_group and push-to-main the filter step is skipped and
  # `code` defaults to true, so the queue's final gate and the main branch
  # always run the full suite. The test jobs still RUN in every case
  # (only their expensive steps are gated), so the required "Tests" and "Tests
  # (no teardown)" checks always report success — a trigger-level `paths`
  # filter would instead leave them unreported and hang branch protection and
  # the merge queue forever.
  changes:
    name: 'Detect changes'
    outputs:
      code: '${{ steps.filter.outputs.code != ''false'' }}'
    permissions:
      contents: 'read'
      pull-requests: 'read'
    runs-on: 'ubuntu-latest'
    steps:
    # Fail-CLOSED deny-list. The `code` filter is a catch-all `'**'` minus a
    # negated list of known test-irrelevant trees, with predicate-quantifier
    # 'every': a changed file matches `code` only when it matches EVERY
    # predicate — i.e. it is some file (`'**'`) AND lands in none of the
    # excluded trees. paths-filter's output is existential (true if ANY changed
    # file matches), so `code` is true whenever at least one changed file is
    # test-RELEVANT, and false only when EVERY changed file is irrelevant — the
    # all-irrelevant PR that may skip. A new or renamed tree is, by default, not
    # on the exclude list, so it counts as relevant and RUNS the suite;
    # forgetting to exclude a genuinely-irrelevant tree only over-runs (safe),
    # never under-runs. Maintain the exclude list as irrelevant trees are
    # added/renamed. (A positive allow-list would instead fail OPEN — an
    # unlisted new test input would silently skip.)
    #
    # Fail-safe: a transient paths-filter/API error must not fail this job. If
    # it did, `needs: changes` would *skip* the test jobs (not run them with
    # steps gated), and a required check skipped via a failed `needs` reports as
    # pending — hanging branch protection, the very thing this design avoids. On
    # error — and on merge_group / push:main, where the step's `if` is false —
    # the step's `code` output is empty, so the job output defaults to true
    # (`'' != 'false'`) and the full suite runs.
    - continue-on-error: true
      id: 'filter'
      if: |
        github.event_name == 'pull_request'
      uses: 'dorny/paths-filter@v3'
      with:
        filters: |
          code:
          - '**'
          - '!frontend/**'
          - '!decks/**'
          - '!brand-assets/**'
          - '!docs/**'
          - '!**/*.md'
          - '!sdk/ts/**'
          - '!sdk/codama/**'
          - '!.claude/**'
          - '!.github/workflows/explorer-image.yml'
          - '!.github/workflows/frontend.yml'
          - '!.github/workflows/lint.yml'
          - '!.github/workflows/sdk.yml'
          - '!.github/workflows/semantic-pr.yml'
          - '!pnpm-lock.yaml'
          - '!pnpm-workspace.yaml'
          - '!cfg/**'
          - '!infra/**'
        predicate-quantifier: 'every'
  # The Python skill-tools under .claude/tools/ are pure-Python scripts (no
  # third-party deps, no Solana/Rust toolchain), so their unit tests run in the
  # lint workflow's `make tools-tests` step rather than this gated Rust suite —
  # which is why .claude/** is on the `code` exclude-list above: a change there
  # skips the expensive Rust build and is covered by lint (which always runs)
  # instead.
  test:
    name: 'Tests'
    needs: 'changes'
    # `actions: write` is what lets install-toolchain delete a cache entry
    # that restored incomplete, so the run which reinstalls also republishes a
    # good entry instead of leaving a poisoned one for every run after it. The
    # probe only spends it on a push to main (see the action), and falls back
    # to warning if the grant is ever absent. Naming permissions explicitly
    # also drops this job to the two scopes it actually uses: checkout needs
    # `contents: read`, and the cache actions ride ACTIONS_RUNTIME_TOKEN
    # rather than GITHUB_TOKEN, so nothing else here is affected.
    permissions:
      actions: 'write'
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v6'
    # Compiler version from the workspace `rust-toolchain.toml`; see the note
    # in lint.yml for the action choice and the neutralized defaults.
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'actions-rust-lang/setup-rust-toolchain@v1'
      with:
        cache: false
        rustflags: ''
    - if: |
        needs.changes.outputs.code == 'true'
      uses: './.github/actions/install-toolchain'
      with:
        anchor-revision: '${{ env.ANCHOR_REV }}'
        solana-version: '${{ env.SOLANA_VERSION }}'
    # sccache content-addresses each rustc compilation and stores the objects in
    # GitHub's Actions cache, plugging the hole rust-cache leaves: rust-cache
    # prunes the workspace crates (dropset, math-core, interface, sdk) and the
    # ~20 integration test binaries, so they recompile from source every run.
    # With sccache those compiles become cache hits whenever the sources are
    # unchanged. Wired only onto the nextest step below (step-level
    # RUSTC_WRAPPER); kept off every make target — the SBF build (poor
    # fit, already .so-cached) and make idl alike.
    #
    # `version` is pinned rather than left to default, in all four jobs that
    # use this action. Left empty the action resolves the newest sccache by
    # calling the GitHub API for mozilla/sccache's latest release on every
    # run, which both floats the compiler cache onto whatever shipped that
    # morning and puts a network round-trip in front of every job — one that
    # has already failed a run here with a TLS `HttpError`. Now that every
    # check is required, such a failure takes the PR out of the merge queue
    # rather than costing a re-run, so the call is worth not making. Pinning
    # skips that lookup entirely. It does not make the step network-free — the
    # binary download remains, though the action checksums it — but it removes
    # one of the two fetches, and specifically the one that has failed.
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'mozilla-actions/sccache-action@v0.0.10'
      with:
        version: 'v0.17.0'
    # rust-cache caches ~/.cargo/{registry,git} plus only the *dependency*
    # build artifacts in target/ (workspace crates are pruned), and re-saves
    # whenever the lockfile/toolchain change — so the cache never freezes at a
    # first-run snapshot and the restored target/ stays small. The shared-key
    # is intentionally the same as the no-teardown job's: their dependency
    # builds are identical across the two feature sets, so they share one
    # dep-artifact cache instead of each saving a full multi-GB target/.
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'Swatinem/rust-cache@v2'
      with:
        cache-on-failure: true
        shared-key: 'rust-test-${{ runner.os }}'
    # Cache the built program .so itself — rust-cache prunes workspace-crate
    # artifacts and never restores the SBF target, so without this the .so is
    # recompiled from scratch every run. The key is content-addressed over
    # every input that determines the binary (program + math-core sources, the
    # lockfile, the workspace/build config, and the pinned toolchain), so an
    # exact hit means the cached .so is valid and the build step below is
    # skipped; any program change misses and rebuilds. Restored after
    # rust-cache so it lands on top of the restored target/.
    - id: 'sbf-cache'
      if: |
        needs.changes.outputs.code == 'true'
      name: 'Cache program .so'
      uses: 'actions/cache@v5'
      with:
        key: 'sbf-default-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{
              env.ANCHOR_REV }}-${{ hashFiles(''programs/dropset/**'',
              ''sdk/math-core/**'', ''Cargo.lock'', ''Cargo.toml'',
              ''Anchor.toml'') }}'
        path: 'target/deploy/dropset.so'
    # target/deploy/ is git-ignored, so materialize the program keypair from
    # its canonical home (keys/AAAA.json) before the build and tests run.
    # This step is unconditional — on an SBF-cache hit the build step below
    # is skipped, but the litesvm tests still read this file, so it must be
    # present regardless. Replaces the old keypair-restore guard.
    - if: |
        needs.changes.outputs.code == 'true'
      name: 'Install program keypair'
      run: 'make program-keypair'
    # Build the program (.so) only on a cache miss — an exact SBF-cache hit
    # restored a valid binary above, so the expensive `cargo build-sbf` is
    # skipped. `make program` runs `anchor keys sync && anchor build`.
    - if: |
        needs.changes.outputs.code == 'true'
        && steps.sbf-cache.outputs.cache-hit != 'true'
      name: 'Build program (.so)'
      run: 'make program'
    # Install the nextest runner (downloaded binary, not compiled).
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'taiki-e/install-action@nextest'
    # Run the whole Rust workspace test suite — including the math-core
    # conformance vectors and the engine-vs-SDK litesvm conformance
    # (tests/sdk_conformance.rs). nextest runs tests from all ~20
    # integration binaries concurrently (process-per-test) instead of the
    # binary-at-a-time run of `cargo test`, the big win for a suite where
    # each test spins a fresh LiteSVM and redeploys the .so. (No doctests
    # are lost: every doc code fence is ```text.)
    - env:
        RUSTC_WRAPPER: 'sccache'
      if: |
        needs.changes.outputs.code == 'true'
      name: 'Run tests'
      run: 'cargo nextest run'
    # IDL-diff gate (interface.md § SDK): the checked-in IDL must match
    # what the pinned anchor-cli regenerates from the program.
    - if: |
        needs.changes.outputs.code == 'true'
      name: 'Verify IDL is up to date'
      run: |
        make idl
        git diff --exit-code -- sdk/idl/dropset.json
    # Visibility guard: a silent regression to cold compiles should be obvious
    # in the run that suffers it rather than inferred weeks later from a
    # timing complaint. sccache reports its own hit rate, and the SBF cache
    # exposes a hit flag. Runs on failure too — a slow failing run is exactly
    # when the numbers are wanted.
    - if: |
        always() && needs.changes.outputs.code == 'true'
      name: 'Cache effectiveness summary'
      run: |
        S="$GITHUB_STEP_SUMMARY"
        echo '### Cache effectiveness' >>"$S"
        echo 'SBF cache hit: ${{ steps.sbf-cache.outputs.cache-hit }}' >>"$S"
        sccache --show-stats >>"$S"
  test-no-teardown:
    name: 'Tests (no teardown)'
    needs: 'changes'
    # Same toolchain-cache self-heal grant as the `test` job above.
    permissions:
      actions: 'write'
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v6'
    # Compiler version from the workspace `rust-toolchain.toml`; see the note
    # in lint.yml for the action choice and the neutralized defaults.
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'actions-rust-lang/setup-rust-toolchain@v1'
      with:
        cache: false
        rustflags: ''
    - if: |
        needs.changes.outputs.code == 'true'
      uses: './.github/actions/install-toolchain'
      with:
        anchor-revision: '${{ env.ANCHOR_REV }}'
        solana-version: '${{ env.SOLANA_VERSION }}'
    # sccache content-addresses each rustc compilation into GitHub's Actions
    # cache, restoring the workspace crates and test binaries that rust-cache
    # prunes. Wired only onto the nextest step below (step-level RUSTC_WRAPPER),
    # never the SBF build (poor fit, already .so-cached). See the `test` job.
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'mozilla-actions/sccache-action@v0.0.10'
      with:
        version: 'v0.17.0'
    # Shares the `test` job's dep-artifact cache via the same shared-key:
    # the dependency builds are identical across the two feature sets, so a
    # cold no-teardown run warms from that cache and only the dropset crate
    # is recompiled feature-off. rust-cache prunes the workspace crates from
    # target/ before saving, so restoring here no longer drags in the full
    # default-feature target/ that previously doubled the on-disk footprint
    # and crashed the runner with "No space left on device".
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'Swatinem/rust-cache@v2'
      with:
        cache-on-failure: true
        shared-key: 'rust-test-${{ runner.os }}'
    # Feature-off counterpart of the `test` job's SBF cache. Keyed with its
    # own `no-teardown` tag so the two jobs cache distinct binaries (the .so
    # built without `admin-teardown`) under the same path without clobbering
    # each other. Exact hit skips the build step below.
    - id: 'sbf-cache'
      if: |
        needs.changes.outputs.code == 'true'
      name: 'Cache program .so'
      uses: 'actions/cache@v5'
      with:
        key: 'sbf-no-teardown-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{
              env.ANCHOR_REV }}-${{ hashFiles(''programs/dropset/**'',
              ''sdk/math-core/**'', ''Cargo.lock'', ''Cargo.toml'',
              ''Anchor.toml'') }}'
        path: 'target/deploy/dropset.so'
    # target/deploy/ is git-ignored, so materialize the program keypair from
    # its canonical home (keys/AAAA.json) before the build and tests run.
    # This step is unconditional — on an SBF-cache hit the build step below
    # is skipped, but the litesvm tests still read this file, so it must be
    # present regardless. Replaces the old keypair-restore guard.
    - if: |
        needs.changes.outputs.code == 'true'
      name: 'Install program keypair'
      run: 'make program-keypair'
    # Build the feature-off .so only on a cache miss; an exact hit restored a
    # valid binary above. `make program-no-teardown` runs `anchor build --
    # --no-default-features`.
    - if: |
        needs.changes.outputs.code == 'true'
        && steps.sbf-cache.outputs.cache-hit != 'true'
      name: 'Build program (.so, no teardown)'
      run: 'make program-no-teardown'
    # Install the nextest runner (downloaded binary, not compiled).
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'taiki-e/install-action@nextest'
    - env:
        RUSTC_WRAPPER: 'sccache'
      if: |
        needs.changes.outputs.code == 'true'
      name: 'Run feature-off teardown-disabled tests'
      run: 'cargo nextest run --no-default-features --test teardown_disabled'
    # See the `test` job's summary step.
    - if: |
        always() && needs.changes.outputs.code == 'true'
      name: 'Cache effectiveness summary'
      run: |
        S="$GITHUB_STEP_SUMMARY"
        echo '### Cache effectiveness' >>"$S"
        echo 'SBF cache hit: ${{ steps.sbf-cache.outputs.cache-hit }}' >>"$S"
        sccache --show-stats >>"$S"
  # Rust↔ASM parity guard. A standalone job (no `needs` beyond `changes`)
  # so it runs in parallel with `test` / `test-no-teardown` rather than
  # extending the critical path. It is the only job that builds BOTH
  # artifacts — the default asm `dropset.so` and the reference
  # `dropset_ref.so` — and asserts the assembly fast path matches the Rust
  # kernel byte-for-byte (plus the CU report and offset pins). A matrix
  # was considered, but the three jobs' build + test commands diverge
  # enough (this one builds two `.so`) that separate jobs stay clearer.
  test-parity:
    name: 'Tests (asm parity)'
    needs: 'changes'
    # Same toolchain-cache self-heal grant as the `test` job above.
    permissions:
      actions: 'write'
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v6'
    # Compiler version from the workspace `rust-toolchain.toml`; see the note
    # in lint.yml for the action choice and the neutralized defaults.
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'actions-rust-lang/setup-rust-toolchain@v1'
      with:
        cache: false
        rustflags: ''
    - if: |
        needs.changes.outputs.code == 'true'
      uses: './.github/actions/install-toolchain'
      with:
        anchor-revision: '${{ env.ANCHOR_REV }}'
        solana-version: '${{ env.SOLANA_VERSION }}'
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'mozilla-actions/sccache-action@v0.0.10'
      with:
        version: 'v0.17.0'
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'Swatinem/rust-cache@v2'
      with:
        cache-on-failure: true
        shared-key: 'rust-test-${{ runner.os }}'
    # Cache BOTH parity artifacts under one content-addressed key (same
    # inputs as the other jobs' SBF caches, distinct `parity` tag). An
    # exact hit restores the pair and skips the two `cargo build-sbf`
    # runs `make program-parity` would otherwise do.
    - id: 'sbf-cache'
      if: |
        needs.changes.outputs.code == 'true'
      name: 'Cache parity program .so pair'
      uses: 'actions/cache@v5'
      with:
        key: 'sbf-parity-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{
              env.ANCHOR_REV }}-${{ hashFiles(''programs/dropset/**'',
              ''sdk/math-core/**'', ''Cargo.lock'', ''Cargo.toml'',
              ''Anchor.toml'') }}'
        path: |
          target/deploy/dropset.so
          target/deploy/dropset_ref.so
    - if: |
        needs.changes.outputs.code == 'true'
      name: 'Install program keypair'
      run: 'make program-keypair'
    # Build both artifacts only on a cache miss (asm dropset.so + reference
    # dropset_ref.so). `make program-parity` runs two `anchor build`s.
    - if: |
        needs.changes.outputs.code == 'true'
        && steps.sbf-cache.outputs.cache-hit != 'true'
      name: 'Build both program artifacts (.so)'
      run: 'make program-parity'
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'taiki-e/install-action@nextest'
    - env:
        RUSTC_WRAPPER: 'sccache'
      if: |
        needs.changes.outputs.code == 'true'
      name: 'Run Rust<->ASM parity tests'
      run: 'cargo nextest run --test asm_parity'
    # See the `test` job's summary step.
    - if: |
        always() && needs.changes.outputs.code == 'true'
      name: 'Cache effectiveness summary'
      run: |
        S="$GITHUB_STEP_SUMMARY"
        echo '### Cache effectiveness' >>"$S"
        echo 'SBF cache hit: ${{ steps.sbf-cache.outputs.cache-hit }}' >>"$S"
        sccache --show-stats >>"$S"
  # The SQL-backed crates (`dropset-feeds` and `dropset-indexer`) reach a real
  # Postgres through testcontainers, so their store suites are `#[ignore]`d
  # and the default `cargo nextest run` above skips them entirely — as it does
  # the feature-gated unit tests, since the feeds transports are off by
  # default. This job covers both gaps. It is deliberately toolchain-light:
  # nothing here builds or loads the program, so it skips install-toolchain,
  # the program keypair, and the SBF cache the other jobs need, and keeps its
  # own rust-cache key rather than dragging in their multi-GB target/.
  #
  # testcontainers talks to the Docker daemon that ubuntu-latest already runs,
  # so no `services:` block is needed — each test starts and disposes of its
  # own database, which is what keeps them independent under nextest's
  # process-per-test parallelism.
  test-postgres:
    name: 'Tests (Postgres)'
    needs: 'changes'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v6'
    # Compiler version from the workspace `rust-toolchain.toml`; see the note
    # in lint.yml for the action choice and the neutralized defaults.
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'actions-rust-lang/setup-rust-toolchain@v1'
      with:
        cache: false
        rustflags: ''
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'mozilla-actions/sccache-action@v0.0.10'
      with:
        version: 'v0.17.0'
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'Swatinem/rust-cache@v2'
      with:
        cache-on-failure: true
        shared-key: 'rust-postgres-${{ runner.os }}'
    - if: |
        needs.changes.outputs.code == 'true'
      uses: 'taiki-e/install-action@nextest'
    # One invocation over both crates so the shared dependency graph compiles
    # once. `--run-ignored all` runs the container-backed suites alongside the
    # ordinary unit tests; the feeds features are named explicitly because a
    # `-p` selection does not enable them.
    #
    # The schema comes from `dropset-db-schema` inside the tests themselves
    # (docs/data-feeds.md §8) — there is no in-crate migrator left to lean on
    # since the single-schema-owner split, and no DDL is issued here.
    - env:
        RUSTC_WRAPPER: 'sccache'
      if: |
        needs.changes.outputs.code == 'true'
      name: 'Run store and feature-gated tests against Postgres'
      run: |
        cargo nextest run --run-ignored all -p dropset-feeds \
        -p dropset-indexer --features dropset-feeds/store,dropset-feeds/http \
        --features dropset-feeds/rpc,dropset-feeds/stream
    # See the `test` job's summary step. No SBF line here: this job builds no
    # program and so has no `sbf-cache` step to report on.
    - if: |
        always() && needs.changes.outputs.code == 'true'
      name: 'Cache effectiveness summary'
      run: |
        S="$GITHUB_STEP_SUMMARY"
        echo '### Cache effectiveness' >>"$S"
        sccache --show-stats >>"$S"
name: 'Tests'
'on':
  merge_group: null
  pull_request: null
  push:
    branches:
    - 'main'
...
