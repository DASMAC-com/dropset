---
env:
  PRE_COMMIT_VERSION: '4.5.1'
  PYTHON_VERSION: '3.14.4'
jobs:
  lint:
    env:
      CONFIG_PATH: 'cfg/pre-commit-lint.yml'
    name: 'Lint'
    # Every GITHUB_TOKEN use here is a read (checkout, and the setup actions'
    # public release lookups); pin that rather than inherit the repository
    # default, since pnpm, pip and pre-commit run third-party install scripts.
    permissions:
      contents: 'read'
    runs-on: 'ubuntu-24.04'
    steps:
    - uses: 'actions/checkout@v6'
    # Resolves the compiler from the workspace `rust-toolchain.toml` by giving
    # no `toolchain` input, which is why this is actions-rust-lang rather than
    # dtolnay/rust-toolchain: the latter's `toolchain` input defaults to
    # matching its own `@rev`, so it cannot read a toolchain file at all and
    # would need the version duplicated at every call site. Two of this
    # action's defaults are deliberately neutralized in all seven call sites —
    # `cache`, because it bundles Swatinem/rust-cache and the explicit
    # rust-cache step owns the key, and `rustflags`, which otherwise injects
    # `-D warnings` into every cargo invocation in the job (the clippy hook
    # passes its own, and a stray RUSTFLAGS also perturbs the rust-cache key).
    #
    # This job needs the toolchain only for `cargo fmt`, which compiles
    # nothing, so it restores no rust-cache: the two cargo-backed hooks run in
    # `lint-rust` below.
    #
    # Every step a `push` run skips carries `if: github.event_name != 'push'`.
    # That run only warms the pre-commit hook cache (see the restore step).
    - if: >-
        github.event_name != 'push'
      uses: >- # v1.17.0
        actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        cache: false
        rustflags: ''
    - if: >-
        github.event_name != 'push'
      uses: >- # v6.0.10
        pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        package_json_file: 'frontend/package.json'
    # The `push` run still needs Node (the cache key names its version, and
    # the Node hooks install against it) but not the pnpm store: with
    # `pnpm install` skipped, nothing reads a restored store, and on a miss
    # the post step would be left saving a path that was never created. So
    # the cache, and the pnpm it needs, are off on `push`; frontend.yml and
    # sdk.yml save the same store key from main.
    - id: 'setup-node'
      uses: 'actions/setup-node@v6'
      with:
        cache: >-
          ${{ github.event_name != 'push' && 'pnpm' || '' }}
        cache-dependency-path: 'pnpm-lock.yaml'
        node-version-file: 'frontend/.node-version'
    # Root install: the frontend + SDK packages share one pnpm workspace.
    - if: >-
        github.event_name != 'push'
      run: 'pnpm install --frozen-lockfile'
    - uses: 'actions/setup-python@v6'
      with:
        cache: 'pip'
        cache-dependency-path: '.github/workflows/lint/requirements.txt'
        python-version: '${{ env.PYTHON_VERSION }}'
    - run: 'pip install -r .github/workflows/lint/requirements.txt'
    # The session helpers are zsh, and `test_ds_pull.py` drives the real
    # function rather than a Python port of it — the shell branches are the
    # substance there. This runner image ships no zsh, so without this the whole
    # suite `skipUnless`-skips and 12 assertions about the base-repo
    # fast-forward (its three-way outcome, the throttle window, the all-digits
    # stamp guard, both self-refresh directions) are gated by nothing but the
    # author happening to run `make tools-tests` on a Mac. The sibling
    # `test_iterm_heal.py` stays darwin-only and correctly keeps skipping:
    # iTerm2 and BSD `stat -f %m` have no Linux equivalent to test.
    - if: >-
        github.event_name != 'push'
      run: 'sudo apt-get install -y --no-install-recommends zsh'
    # Python skill-tool unit tests (stdlib only, reuses the cached Python set up
    # above — no new cache). Folds in the old dedicated stage-backlog-tests job.
    - if: >-
        github.event_name != 'push'
      run: 'make tools-tests'
    # Production-build the decks. `decks` is a member of the pnpm workspace the
    # install above already provisioned, so this is one `next build` with no new
    # setup or cache. It runs here rather than in the Rust-gated test workflow
    # because that one path-filters decks/** out. The build's `prebuild` hook
    # hard-fails on a remote asset it can't mirror, so a deck with a broken
    # image can't reach main: this job gates both pull_request and merge_group.
    - if: >-
        github.event_name != 'push'
      run: 'make decks-build'
    # The hook cache needs a default-branch copy to be readable from a
    # merge-queue ref or a new PR, and only the `push: main` trigger makes
    # one: without it every queue entry paid a cold `install-hooks` (median
    # 1.6 min, about a fifth of the queue's critical path). That run keeps
    # only checkout, the Node and Python setup, the pip install, this
    # restore, `install-hooks` and the save, so it costs up to about two
    # runner-minutes after each merge, off the critical path. A same-key
    # restore on main hits and the save is skipped, so a push rewrites this
    # cache only when the config, pre-commit, Node or Python moves (the pip
    # cache setup-python keeps follows the requirements file instead).
    - id: 'pre-commit-cache'
      uses: 'actions/cache/restore@v5'
      with:
        key: 'pre-commit-lint-${{ runner.os }}-${{ runner.arch }}-node-${{
              steps.setup-node.outputs.node-version }}-python-${{
              env.PYTHON_VERSION }}-pre-commit-${{ env.PRE_COMMIT_VERSION
              }}-${{ hashFiles(env.CONFIG_PATH) }}'
        path: '~/.cache/pre-commit'
    - run: 'pre-commit install-hooks -c ${{ env.CONFIG_PATH }}'
    # Every hook but the two that `lint-rust` runs, which were about 80% of
    # this step's wall time before the split.
    - env:
        SKIP: 'clippy,rustdoc'
      if: >-
        github.event_name != 'push'
      run: >-
        pre-commit run --all-files --color=always --show-diff-on-failure
        --config ${{ env.CONFIG_PATH }}
    - if: |
        always() && steps.pre-commit-cache.outputs.cache-hit != 'true'
      uses: 'actions/cache/save@v5'
      with:
        key: 'pre-commit-lint-${{ runner.os }}-${{ runner.arch }}-node-${{
              steps.setup-node.outputs.node-version }}-python-${{
              env.PYTHON_VERSION }}-pre-commit-${{ env.PRE_COMMIT_VERSION
              }}-${{ hashFiles(env.CONFIG_PATH) }}'
        path: '~/.cache/pre-commit'
  # The two cargo-backed hooks, one job each, beside `lint` rather than inside
  # it: run serially there they set the merge queue's critical path (clippy
  # about 1.9 min and rustdoc about 1.4 min of a 6.6 min job). Each is its own
  # required check, `Lint (clippy)` and `Lint (rustdoc)`. Both hooks are
  # `language: system`, so `pre-commit run <hook>` installs no hook
  # environment and this job needs neither Node nor the hook cache; Python is
  # here only for pre-commit and the hooks' `cargo_scope.py` entry. A `push`
  # run skips the job outright, having no hook cache to warm.
  lint-rust:
    env:
      CONFIG_PATH: 'cfg/pre-commit-lint.yml'
    if: >-
      github.event_name != 'push'
    name: 'Lint (${{ matrix.hook }})'
    permissions:
      contents: 'read'
    runs-on: 'ubuntu-24.04'
    steps:
    - uses: 'actions/checkout@v6'
    - uses: >- # v1.17.0
        actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        cache: false
        rustflags: ''
    # Shares the test jobs' dep-artifact cache rather than keeping a
    # `rust-lint` key of its own. What used to keep this job on a separate
    # entry was the `RUST_VERSION` variable defined only here: rust-cache
    # hashes environment variables matching a `RUST` prefix into its key, so
    # this job alone computed a different hash. That variable was dead config
    # and is gone, so the keys now coincide — measured, `full match: true` on
    # `v0-rust-rust-test-Linux-Linux-x64-cee1353d-…` in lint, sdk and the
    # test jobs alike. Two wins: one ~0.6 GB copy per ref stops being stored,
    # and this job — restore-only through `save-if: false` below, and never
    # run on `push: main` — can restore one, warming merge-queue runs and the
    # first run of every new PR.
    # `save-if: false` makes this job a restore-only consumer of that entry,
    # and it is load-bearing rather than tidiness. rust-cache skips its save
    # whenever the restore was an exact key match, so the FIRST job to finish
    # on a fresh key decides the entry's contents for that whole
    # lockfile-plus-toolchain generation. This job and sdk carry thinner
    # dependency sets than the three test jobs, so letting either win that
    # race would freeze a thin entry that the program-building jobs then
    # restore on every later run — making the critical path slower, which is
    # the opposite of the point. Only the test jobs write; lint and sdk read.
    #
    # A corollary worth stating, because it has been missed before: while
    # `save-if: false` stands below, every save-side rust-cache input here is
    # inert, `cache-on-failure` included. That covers `cache-workspace-crates`,
    # which was proposed here to hand clippy back its workspace artifacts: it
    # governs what a save prunes, and this job never saves. Setting it on the
    # three test jobs that share this key does not help either: `cargo clippy`
    # sets `RUSTC_WORKSPACE_WRAPPER`, which enters the fingerprint of workspace
    # members but not of dependencies — the same asymmetry that makes deps
    # reusable across build and clippy in the first place — so clippy cannot
    # reuse workspace artifacts a test job compiled. Caching clippy's own would
    # need this job to save under a key of its own from a default-branch run
    # that compiles the workspace, which no run of this workflow does.
    - uses: >- # v2.9.3
        Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        cache-on-failure: true
        save-if: false
        shared-key: 'rust-test-${{ runner.os }}'
    - uses: 'actions/setup-python@v6'
      with:
        cache: 'pip'
        cache-dependency-path: '.github/workflows/lint/requirements.txt'
        python-version: '${{ env.PYTHON_VERSION }}'
    - run: 'pip install -r .github/workflows/lint/requirements.txt'
    - run: >-
        pre-commit run ${{ matrix.hook }} --all-files --color=always
        --show-diff-on-failure --config ${{ env.CONFIG_PATH }}
    # Both legs report whatever the other does, so one red hook never cancels
    # the other's verdict.
    strategy:
      fail-fast: false
      matrix:
        hook:
        - 'clippy'
        - 'rustdoc'
name: 'Lint'
'on':
  merge_group: null
  pull_request: null
  push:
    branches:
    - 'main'
...
