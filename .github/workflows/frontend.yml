---
# cspell:word prerenders
# cspell:word Vercel
env:
  # env.ts validates these at module scope, so `next build` throws without
  # them. Placeholders are enough: every route prerenders as static content
  # and nothing fetches at build time, so the values are compiled into the
  # bundle but never dialed. A real endpoint would add a network dependency
  # to the gate for no signal.
  NEXT_PUBLIC_GET_MULTIPLE_ACCOUNTS_BATCH_SIZE: '10'
  NEXT_PUBLIC_RPC_URL: 'https://api.mainnet-beta.solana.com'
  NEXT_PUBLIC_WS_URL: 'wss://api.mainnet-beta.solana.com'
  NODE_VERSION: '25'
jobs:
  frontend:
    name: 'Frontend'
    permissions:
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v6'
    - uses: 'pnpm/action-setup@v6'
      with:
        package_json_file: 'frontend/package.json'
    - uses: 'actions/setup-node@v6'
      with:
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'
        node-version: '${{ env.NODE_VERSION }}'
    - run: 'pnpm install --frozen-lockfile'
    # Every icon URL must resolve, on every run — not just on PRs that touch
    # the icon inputs. The point is that a reference which has gone stale
    # blocks merges until someone updates it, so the committed URLs always
    # describe where the issuer actually serves the asset today. A check
    # scoped to icon-touching PRs would never fire for the case that
    # matters most: an issuer moving an asset long after the URL was added.
    #
    # This runs before the build so the network check fails fast, and is
    # deliberately not cached — a cache hit would defeat it. The retry and
    # timeout inside the script are what keep it from tripping on a blip;
    # only a URL that fails every attempt fails the job. Note the icons are
    # actually fetched three times per run: `postinstall` above, this step,
    # and `prebuild` inside the build below. Only this one can fail the job.
    #
    # Tradeoff, accepted knowingly: because this also gates merge_group, a
    # sustained outage at a third-party CDN can block unrelated merges until
    # it recovers or the URL is pointed somewhere else. A live asset served
    # under an odd content-type does NOT block — the script falls back to
    # sniffing the bytes, so only genuinely unusable responses fail.
    #
    # Both asset sets are gated, on the same reasoning and through the same
    # engine (frontend/scripts/mirror-icons.mjs). Wallet icons add five more
    # externally-controlled URLs that can red-line the queue, which is a real
    # widening of the exposure described above; they are gated anyway because
    # leaving a set unchecked is exactly how the token icons came to carry a
    # silently broken mirror in the first place. The issuers are also a smaller
    # and more stable set than the stablecoin ones, so the added risk is modest.
    - name: 'Token icon URLs are live'
      run: 'node frontend/scripts/fetch-token-icons.mjs --strict'
    - name: 'Wallet icon URLs are live'
      run: 'node frontend/scripts/fetch-wallet-icons.mjs --strict'
    # The frontend's unit tests. They run here rather than in test.yml, whose
    # paths filter excludes frontend/** entirely; this job is the only one that
    # installs the frontend's dependencies. Scoped to pure logic (price and
    # decimals conversion, icon-source resolution) — the price helper is one
    # half of a cross-language pair whose Rust twin in tui/src/book.rs is
    # covered, so without this the TS fork was the only side that could drift
    # unnoticed. Runs before the build because a logic failure is faster to
    # report and easier to read than a build log.
    - name: 'Frontend unit tests'
      run: 'pnpm --filter dropset-frontend test'
    # Nothing else in CI runs `next build`: lint.yml stops at biome + tsc, so a
    # build break only surfaced on Vercel. This also runs the `prebuild` asset
    # chain, which is the only thing that exercises copy-brand-assets and
    # copy-flags at all — they are prebuild-only, so before this job they ran
    # in CI zero times.
    - name: 'Frontend builds'
      run: 'pnpm --filter dropset-frontend build'
name: 'Frontend'
'on':
  merge_group: null
  pull_request: null
  push:
    branches:
    - 'main'
...
