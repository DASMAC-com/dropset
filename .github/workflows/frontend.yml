---
# cspell:word dweb
# cspell:word prerenders
# cspell:word Vercel
env:
  # env.ts validates these at module scope, so `next build` throws without
  # them. Placeholders are enough: every route prerenders as static content
  # and nothing fetches at build time, so the values are compiled into the
  # bundle but never dialed. A real endpoint would add a network dependency
  # to the gate for no signal.
  #
  # The vault gate below does dial a real endpoint, but it takes its own
  # step-scoped RPC_URL rather than borrowing from here — so this block stays
  # a placeholder set, and pointing the gate at a dedicated provider later
  # cannot leak that provider's URL into the built bundle.
  NEXT_PUBLIC_GET_MULTIPLE_ACCOUNTS_BATCH_SIZE: '10'
  NEXT_PUBLIC_RPC_URL: 'https://api.mainnet-beta.solana.com'
  NEXT_PUBLIC_WS_URL: 'wss://api.mainnet-beta.solana.com'
  NODE_VERSION: '25'
jobs:
  frontend:
    name: 'Frontend'
    permissions:
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v6'
    - uses: 'pnpm/action-setup@v6'
      with:
        package_json_file: 'frontend/package.json'
    - uses: 'actions/setup-node@v6'
      with:
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'
        node-version: '${{ env.NODE_VERSION }}'
    - run: 'pnpm install --frozen-lockfile'
    # Token icons are COMMITTED (brand-assets/token-icons/), so this gate
    # dials nothing: it checks that every currency listed in currencies.json
    # has a committed icon, by reading a directory. Deterministic, so it is
    # safe in a required job — it cannot flake and cannot be red-lined by a
    # third party.
    #
    # It replaces a strict fetch of ~25 issuer URLs that ran here. That gate
    # produced six merge-queue dequeues across three PRs on a dweb.link 429,
    # and then its own interim fix failed on a different host in a different
    # mode (a ~32s timeout on shared hosting) and passed clean on re-run —
    # two hosts, two failure modes, one evening. Because it gated merge_group,
    # where a PR-path check cannot see it, none of that could be caught
    # before the queue.
    #
    # What is deliberately NOT gated here any more: whether the committed
    # bytes still match what the issuer serves. That is genuine drift
    # detection and it needs the network, so it moved to the non-required
    # token-icon-audit.yml, which warns and never blocks. The intent the old
    # gate served — a stale reference does not sit unnoticed — is preserved;
    # only its ability to stop merges is gone.
    #
    # Wallet icons still mirror at build time through the shared engine
    # (frontend/scripts/mirror-icons.mjs) and are still gated strictly, so
    # five externally-controlled URLs can still red-line the queue. That is
    # unchanged exposure, not new, and narrowing it is the wallet pipeline's
    # own call — the committed-icon redesign scoped itself to the token set
    # and left the wallet and flag pipelines alone.
    - name: 'Every listed currency has a committed icon'
      run: 'node frontend/scripts/build-token-manifest.mjs --strict'
    - name: 'Wallet icon URLs are live'
      run: 'node frontend/scripts/fetch-wallet-icons.mjs --strict'
    # Every listed currency must have a platform-fee vault — its ATA under
    # the fee wallet — onchain. DFlow rejects any /order whose feeAccount
    # does not exist, so a currency listed without one silently forfeits the
    # 5 bps platform fee on every DFlow-routed swap into it. Nothing else
    # surfaces that: the swap succeeds, it just earns nothing.
    #
    # Unscoped on purpose, on the same reasoning as the icon gates above. A
    # filter on currencies.json edits would fire on the listing PR and never
    # again, so it could not see a vault created late, or closed later to
    # reclaim rent. That is not hypothetical — EUROP was listed, merged
    # green, and its vault was still missing a day later, which is what
    # prompted this gate.
    #
    # Tradeoff, accepted knowingly: this couples listing a currency to a
    # funded mainnet transaction, and since it gates merge_group too, a
    # missing vault blocks unrelated merges until someone creates it. There
    # is deliberately no opt-out list — an escape hatch is precisely how a
    # revenue gap becomes permanent.
    #
    # The address arrives from a secret rather than a variable because the
    # script echoes it and Actions masks only secrets. Both inputs are scoped
    # to this step: they belong to the gate, not to the build.
    - env:
        NEXT_PUBLIC_PLATFORM_FEE_WALLET: '${{ secrets.PLATFORM_FEE_WALLET }}'
        RPC_URL: 'https://api.mainnet-beta.solana.com'
      name: 'Platform-fee vaults exist'
      run: 'node frontend/scripts/setup-fee-atas.mjs --check'
    # The frontend's unit tests. They run here rather than in test.yml, whose
    # paths filter excludes frontend/** entirely, so a test step placed there
    # would never fire for a frontend-only change. Scoped to pure logic:
    # price and decimals conversion, and icon-source resolution. The decimals
    # half of the price helper is mirrored in Rust by util/src/decimals.rs,
    # but its probe step is TS-only, so these are the sole coverage of the
    # flooring bug that collapsed adjacent ladder levels onto one displayed
    # price. Runs before the build because a logic failure is faster to
    # report and easier to read than a build log.
    #
    # The currencies suite asserts the icon manifest is populated. That no
    # longer depends on step order: `postinstall` builds the manifest from
    # the committed icons, with no network, so it is fully populated before
    # any step below runs. The strict step above is what keeps it that way
    # as currencies are added, but the tests no longer need it to have run
    # first — this used to be a hard ordering constraint and is now only a
    # preference for reporting a logic failure before a build log.
    - name: 'Frontend unit tests'
      run: 'pnpm --filter dropset-frontend test'
    # Nothing else in CI runs the frontend's `next build`: lint.yml stops at
    # biome + tsc for frontend/**, so a build break only surfaced on Vercel
    # (lint.yml does build decks/, but that is a separate app). This also runs
    # the `prebuild` asset chain, which is the only thing that exercises
    # copy-brand-assets and copy-flags at all — they are prebuild-only, so
    # before this job they ran in CI zero times.
    - name: 'Frontend builds'
      run: 'pnpm --filter dropset-frontend build'
name: 'Frontend'
'on':
  merge_group: null
  pull_request: null
  push:
    branches:
    - 'main'
...
