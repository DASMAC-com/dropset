# cspell:word amannn
---
concurrency:
  # The backstop for a push that reaches GitHub without the trigger tool: a
  # newer PR-head run cancels the stale one. Any other event takes a group of
  # its own (the run id, not the ref), since a shared group evicts its pending
  # run even with cancel-in-progress off, and a merge-group or main run must
  # never be cancelled (docs/ci.md, "Local-first remote runs").
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' }}
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('run-{0}', github.run_id) }}
jobs:
  semantic-pr:
    name: 'Semantic PR'
    runs-on: 'ubuntu-latest'
    steps:
    - env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      # Assume success in a merge group by skipping the step, which
      # can't access a PR title inside a merge group.
      if: |
        github.event_name != 'merge_group'
      uses: >- # v6.1.1
        amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
      with:
        requireScope: true
        scopes: '^ENG-[0-9]+$'
        subjectPattern: '^[A-Z].*$'
        validateSingleCommit: true
        validateSingleCommitMatchesPrTitle: true
name: 'Semantic PR'
'on':
  merge_group: null
  pull_request:
    types:
    - 'edited'
    - 'opened'
    - 'reopened'
    - 'synchronize'
permissions:
  pull-requests: 'read'
...
