# Cross-cutting plumbing shared by the workspace's off-chain crates (the TUI
# and the maker / taker bots). Two modules, kept apart because they serve
# unrelated paths: `localnet` — the SPL / ATA / System program-id consts, the
# associated-token-account derivation and its raw SPL byte-instruction builders
# (create-idempotent-ATA, mint-to), which seed a local validator's mock mints;
# and `rpc` — the Agave `http`→`ws` PubSub-URL derivation the fill
# subscriptions share, which the production maker needs too. Pure — no
# `RpcClient`, no `Keypair`, no signing: it builds `Instruction`s and derives
# addresses, and each consumer keeps its own send path (the TUI's carries CU
# measurement the bots don't). Rust-only, not published.

[dependencies]
# Pinned to the SDK's 3.x line (sdk/rs/Cargo.toml) so there is one
# `Pubkey` / `Instruction` type across the builder and transaction paths in
# every consumer — NOT the workspace's solana-pubkey 4.x, which the on-chain
# crate uses.
solana-instruction = "3"
# `curve25519` supplies `Pubkey::find_program_address` (the off-curve PDA
# check the ATA derivation needs).
solana-pubkey = { version = "3", features = ["curve25519"] }

[lib]
name = "dropset_util"
path = "src/lib.rs"

[package]
description = "Cross-cutting chain plumbing shared by the Dropset off-chain crates."
name = "dropset-util"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
