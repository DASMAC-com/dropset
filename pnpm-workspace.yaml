---
# cspell:word prismjs
# Hold any dependency version published less than two days ago (the value is
# in minutes): every 2026 npm worm's malicious versions were pulled from the
# registry inside that window. Seven days buys no extra coverage and only
# delays routine bumps. The excludes are the packages whose security patches
# must never be held.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
- 'next'
- 'react'
- 'react-dom'
- 'sharp'
# `onlyBuiltDependencies` allow-lists deps whose install scripts may run
# (e.g. sharp's native build for Next); it must live at the workspace root
# to take effect. The frontend + SDK packages share this one workspace.
onlyBuiltDependencies:
- 'sharp'
# The decks package runs React 18 (Spectacle's supported range) while the
# frontend runs React 19. Both pull in shared @radix-ui primitives, so
# without this pin pnpm collapses them onto a single @types/react major and
# the wrong React typings leak across packages. Force one @types major for
# the whole workspace so type resolution is deterministic.
#
# The sharp floor is the workaround for the image optimizer's SVG RCE
# (0.35.5 or later). Next pulls sharp in as an optional dependency, so the
# floor is pinned here rather than trusting each Next release's own range;
# the caret keeps it inside the range Next declares, so revisit it when a
# Next bump moves sharp's range.
#
# The parent-scoped entries below lift prod advisories (`make deps-audit`)
# a parent pins in place: Next pins postcss exactly, Spectacle's chain
# (remark-parse, broadcast-channel, refractor) holds old trim,
# @babel/runtime and prismjs, and @metamask/utils holds uuid 9. Drop each
# entry once its parent's own range clears the advisory. Spectacle's
# decode-uri-component has no override: the fixed line is ESM-only, which
# its CJS query-string 7 cannot require, and query-string 9 drops the named
# exports Spectacle imports, so those two ids are standing exceptions in
# cfg/pnpm-audit.toml.
overrides:
  '@metamask/utils>uuid': '^11.1.1'
  '@types/react': '^19'
  '@types/react-dom': '^19'
  'broadcast-channel>@babel/runtime': '^7.26.10'
  'next>postcss': '^8.5.23'
  'refractor>prismjs': '^1.30.0'
  'remark-parse>trim': '^0.0.3'
  'sharp': '^0.35.5'
packages:
- 'frontend'
- 'decks'
- 'sdk/ts'
- 'sdk/codama'
...
