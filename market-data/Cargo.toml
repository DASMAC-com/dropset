# cspell:word rustls
# The market-data collection app (docs/data-feeds.md §7), and the first
# consumer of the shared `feeds` framework — so it proves the source →
# store-sink path end to end. Seven binaries, one per venue-and-tier, and the
# tier is what decides the table each writes:
#
# * Candles into `cex_prices` — `market-data-coinbase` (the crypto reference
#   feed, §9) and the free-tier FX roster `market-data-oanda` /
#   `-twelvedata` / `-alphavantage` (§9 "The free-tier FX roster").
# * Spot ticks into `spot_ticks` — `market-data-kraken` (batched peg truth),
#   `market-data-pyth` (batched FX with a published confidence), and
#   `market-data-coinbase-ticker` (the prints between candle closes).
#
# One binary serves a **venue**, not a pair: each takes a product roster, so
# covering another pair is configuration rather than another service.
#
# Schema provisioning belongs to `dropset-migrate`, the single schema owner
# (§8), so this crate ships no migrate runner. HTTP-only: it enables `feeds`'
# `http` + `store` features and never compiles the Solana or streaming
# transports.
#
# Each binary is declared rather than left to `src/bin` auto-discovery, so the
# deployed command name carries the crate prefix the compose services invoke.
# Adding one here also needs a line in the runtime `COPY` of
# `infra/localnet/collectors.Dockerfile`, which enumerates them.

[[bin]]
name = "market-data-alphavantage"
path = "src/bin/alphavantage.rs"

[[bin]]
name = "market-data-coinbase"
path = "src/bin/coinbase.rs"

[[bin]]
name = "market-data-coinbase-ticker"
path = "src/bin/coinbase_ticker.rs"

[[bin]]
name = "market-data-kraken"
path = "src/bin/kraken.rs"

[[bin]]
name = "market-data-oanda"
path = "src/bin/oanda.rs"

[[bin]]
name = "market-data-pyth"
path = "src/bin/pyth.rs"

[[bin]]
name = "market-data-twelvedata"
path = "src/bin/twelvedata.rs"

[dependencies]
anyhow = "1"
# `feeds`' `Source` / `StoreWriter` are `#[async_trait]` traits, so this crate
# needs the macro to implement them.
async-trait = "0.1"
# The single schema owner. This crate issues no DDL; it depends on the owner
# only to assert at startup that the tables it writes already exist.
dropset-db-schema = { path = "../db-schema" }
# The shared ingestion framework: the Coinbase source composes its `HttpClient`
# and its `PgCursorStore`, and the collector binary the `run` runner +
# `StoreSink`. Only the poll-into-store path is needed, so just `http` + `store`
# — no `rpc`/`stream`, so no Solana tree.
dropset-feeds = { path = "../feeds", features = ["http", "store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Runtime (string-typed) queries; no compile-time `DATABASE_URL`, so no
# `macros`/`migrate` feature. `rustls` matches the store sink's TLS backend so
# nothing pulls in openssl.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `tests/instruments.rs` runs the roster-registration statement against a real
# Postgres in a throwaway container, matching db-schema's own fence tests. It
# earns the dependency because that statement is reachable from no other gate:
# it is a runtime (string-typed) query loaded by `include_str!`, so neither
# clippy nor a compile-time macro can see it, and a typo in it would pass every
# check in the repo and then abort startup for all seven collectors. The test is
# `#[ignore]`d — it needs a Docker daemon; run it with
# `cargo test -p dropset-market-data -- --ignored`.
testcontainers-modules = { version = "0.11", features = ["postgres"] }

[package]
description = "Market-data collection app and its crypto and FX reference feeds."
name = "dropset-market-data"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
