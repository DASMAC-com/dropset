# cspell:word rustls
# The market-data collection app (docs/data-feeds.md §7), and the first
# consumer of the shared `feeds` framework — so it proves the source →
# store-sink path end to end. One binary,
# `market-data-coinbase` (the Coinbase EURC/USDC reference feed, §9); schema
# provisioning belongs to `dropset-migrate`, the single schema owner (§8), so
# this crate no longer ships a migrate runner. HTTP-only: it enables `feeds`'
# `http` + `store` features and never compiles the Solana or streaming
# transports.

[[bin]]
name = "market-data-coinbase"
path = "src/bin/coinbase.rs"

[dependencies]
anyhow = "1"
# `feeds`' `Source` / `StoreWriter` are `#[async_trait]` traits, so this crate
# needs the macro to implement them.
async-trait = "0.1"
# The single schema owner. This crate issues no DDL; it depends on the owner
# only to assert at startup that the tables it writes already exist.
dropset-db-schema = { path = "../db-schema" }
# The shared ingestion framework: the Coinbase source composes its `HttpClient`
# and its `PgCursorStore`, and the collector binary the `run` runner +
# `StoreSink`. Only the poll-into-store path is needed, so just `http` + `store`
# — no `rpc`/`stream`, so no Solana tree.
dropset-feeds = { path = "../feeds", features = ["http", "store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Runtime (string-typed) queries; no compile-time `DATABASE_URL`, so no
# `macros`/`migrate` feature. `rustls` matches the store sink's TLS backend so
# nothing pulls in openssl.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
description = "Market-data collection app and its Coinbase reference feed."
name = "dropset-market-data"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
