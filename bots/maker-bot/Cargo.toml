# Localnet market-maker bot for the FX-stablecoin demo markets. A supervisor
# over many <token>/USDC markets quoting on the eCLOB per
# docs/market-making.md: poll a batched tiered price feed, compose a
# per-market fair mid, and drive the relative-quoting hot path
# (set_reference_price) and cold path (set_liquidity_profile) with an inventory
# skew and kill-switch policy. Rust-only, not published. No tokio: a
# RpcClient (sdk/rs `fetch` feature), matching the TUI and sync-blockers. The
# price / fill *transport* runs on the shared `feeds` framework (source → live
# forward sink), so a small background tokio runtime drives those async
# sources; the quoting tick loop stays synchronous and drains the broadcast
# tail with `try_recv` (docs/data-feeds.md §6).

[[bin]]
name = "dropset-maker-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Implement the `feeds` `Source` trait on the price / fill adapters (the trait
# is `#[async_trait]`).
async-trait = "0.1"
# Inner-instruction `data` comes back base58-encoded from `getTransaction`
# even under base64 transaction encoding, so decode it before parsing.
bs58 = "0.5"
# Zero the `LiquidityProfile` Pod before filling its levels, and read the
# on-chain `Vault` slab mirror for live inventory (matches the SDK's own
# profile construction and the TUI's account decoding).
bytemuck = "1"
# The shared off-chain fair-value engine: `fair = fx × basis` with the two-peg
# basis decomposition, the basis EMA, the composition regimes, and the
# basis-band / USDC common-mode guard signals (docs/market-making.md §1).
# The bot owns the feed transport and hands the engine `Reading`s.
dropset-fair-value = { path = "../../fair-value" }
# The shared ingestion framework: the price sources poll over its async
# `HttpClient` (`http`), the fill subscription bridges through its `stream`
# seam (`ChannelSource`), and both fan into an in-process forward (live) sink
# the tick loop reads (docs/data-feeds.md §6).
dropset-feeds = { path = "../../feeds", features = ["http", "stream"] }
# Shared chain plumbing: `rpc`'s Agave `http`→`ws` PubSub-URL derivation
# (the fill subscription's endpoint). The `emit_cpi!` fill decode is the SDK's
# shared `events` codec, not a hand-rolled discriminator.
dropset-util = { path = "../../util" }
# The off-chain client: Codama instruction builders + the `quoting` helpers
# (set_reference_price_ix / set_liquidity_profile_ix / NativeBook), the typed
# `fetch_*` account decoders, the `layout` slab mirror (active-vault walk for
# inventory), the `Price` codec, the shared `events` fill-event codec, and the
# blocking `RpcClient` — all behind `fetch`.
dropset-sdk = { path = "../../sdk/rs", features = ["fetch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the SDK's 3.x line (sdk/rs/Cargo.toml) so there is one
# `Pubkey` / `Instruction` / `RpcClient` type across the builder, fetch, and
# transaction paths — NOT the workspace's solana-pubkey 4.x. `~3.1` on
# solana-client matches the validator minor the Makefile gates (3.1.x).
solana-client = "~3.1"
solana-commitment-config = "3"
# `ComputeBudgetInstruction::set_compute_unit_price` — the priority fee on the
# stale-quote kill stamp, which has to outrace takers in the first blocks after
# the bot comes back (docs/market-making.md §4).
solana-compute-budget-interface = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-pubkey = "3"
# Parse the `getTransaction` signature from the logs-subscription notification.
solana-signature = "3"
solana-signer = "3"
solana-transaction = "3"
# Name the `getTransaction` response shapes (`EncodedConfirmedTransaction…`,
# `UiInstruction`, the inner-instruction list) the fill decoder walks. The
# light client-types crate, not the full `solana-transaction-status`.
solana-transaction-status-client-types = "3"
# A background runtime for the `feeds` source runners only (the price polls and
# the fill-stream bridge); the quoting tick loop stays synchronous and reads
# the resulting broadcast channels with `try_recv`. `net` + `time` back the
# reqwest reactor the HTTP sources use.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time"] }
# Surface the `feeds` runner's `tracing` diagnostics (a source failing / backing
# off) on stderr — the migration moved feed polling behind the framework, whose
# only failure signal is a `tracing` event, so without a subscriber a down feed
# is silent. `RUST_LOG` overrides the default `info` filter.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Test-only: forge the `[tag][discriminator][body]` fill-event envelope the
# decoder consumes. `borsh` serializes the event body and `sha2` reproduces
# the `sha256("event:FillEvent")[..8]` discriminator — neither is needed at
# runtime, where the SDK's shared `events` codec owns the decode.
[dev-dependencies]
borsh = "1"
sha2 = "0.10"

[package]
description = "Localnet FX-stablecoin market-maker bot for the Dropset demo markets."
name = "dropset-maker-bot"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
