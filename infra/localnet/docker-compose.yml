---
# cspell:word healthcheck
# cspell:word isready
# Localnet Docker stack.
#
# Seed service: the Solana Explorer, served on http://localhost:3100 so a
# loopback page reaches the loopback validator RPC without the
# public-site -> localhost block that stalls the hosted explorer. Host port
# 3100 (not 3000) leaves localhost:3000 to the frontend's `next dev`, so the
# explorer and the frontend can run at the same time.
#
# The indexer stack (postgres + indexer + indexer-api) joins this same stack
# (docs/indexer.md §8): the worker polls the host validator for events and
# the api serves /v1 on http://localhost:8080. Bring it up with
# `make indexer-up`.
#
# There is exactly ONE Postgres here, the shared `dropset` database
# (docs/data-feeds.md §8) — on-chain indexer tables, external market-data
# price tables, and the maker go-between tables as they land. The market-data
# collectors used to run their own Postgres in a second compose file; that
# split is gone, because the joins that matter cross it (attributing realized
# PnL means joining indexer fills against external price history at fill
# time). Bring the collectors up with `make collectors-up`.
#
# `migrate` is the one-shot schema gate: `dropset-migrate` owns all DDL and
# every database-writing service waits for it to exit successfully. It is
# idempotent, so it re-runs harmlessly whenever the stack restarts, and
# pointing it at a fresh volume replays the whole history — which is also the
# local reset story.
#
# The maker + taker bots join too (`make bots-up`): both sign with the repo
# `keys/` keypairs bind-mounted in, reach the host-run validator at
# host.docker.internal:8899, and refuse any non-localnet genesis. The host
# validator is intentionally not a service here — the dropset-tui control
# plane owns its lifecycle. Future localnet services join this stack too.
#
# The dropset-tui control plane owns this stack's lifecycle: it brings the
# explorer up in the background at launch and tears it down on quit.
# `make explorer` / `make explorer-down` drive it by hand.
name: 'dropset-localnet'
services:
  coinbase:
    # The Coinbase reference-price collector: resume from the saved cursor,
    # backfill then poll the candles endpoint, and persist closed buckets into
    # `cex_prices`. Keyless — the Coinbase Exchange public REST API needs no
    # credentials — and unrelated to the validator, so it is the one service
    # here that runs happily with no localnet up at all.
    build:
      context: '../..'
      dockerfile: 'market-data/Dockerfile'
    command:
    - 'market-data-coinbase'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      BACKFILL_DAYS: '${BACKFILL_DAYS:-60}'
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      PRODUCT_ID: '${PRODUCT_ID:-EURC-USDC}'
      RUST_LOG: 'info'
    restart: 'unless-stopped'
  explorer:
    # `.github/workflows/explorer-image.yml` builds this image (multi-arch) and
    # pushes it to the `image:` tag below; `pull` / `up` prefer that prebuilt
    # image so a cold localnet doesn't pay the from-source build. This `build:`
    # is the fallback compose uses when the tag can't be pulled (offline, or a
    # freshly-bumped version CI hasn't published yet). The explorer source ref
    # is pinned in explorer.Dockerfile (`ARG EXPLORER_REF`); bump it and the
    # `image:` tag together to cut a new version.
    build:
      context: '.'
      dockerfile: 'explorer.Dockerfile'
    # The explorer reads localnet state client-side (the browser hits the
    # customUrl RPC directly); the host gateway lets any server-side fetch
    # reach a host-run validator at http://host.docker.internal:8899.
    extra_hosts:
    - 'host.docker.internal:host-gateway'
    # The CI-published image localnet pulls. Bump this tag (with EXPLORER_REF
    # in explorer.Dockerfile) in one commit to cut a new version; the workflow
    # publishes it and localnet pulls it instead of building from source.
    image: 'dasmac/dropset-localnet-explorer:v1'
    # Bind to loopback only — a local dev viewer, not a LAN service. Host port
    # 3100 dodges the frontend's localhost:3000; the container serves 3000.
    ports:
    - '127.0.0.1:3100:3000'
    # Prefer a locally-cached image, else pull the tag above; the `build:`
    # falls in only when that pull is unavailable.
    pull_policy: 'missing'
    restart: 'unless-stopped'
  indexer:
    # Decode + persist + aggregate. Polls the host-run validator's events.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/indexer.Dockerfile'
    command:
    - 'dropset-indexer'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      RPC_URL: 'http://host.docker.internal:8899'
      RUST_LOG: 'info'
    extra_hosts:
    - 'host.docker.internal:host-gateway'
    restart: 'unless-stopped'
  indexer-api:
    # The /v1 REST surface, on loopback http://localhost:8080.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/indexer.Dockerfile'
    command:
    - 'dropset-indexer-api'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      API_BIND: '0.0.0.0:8080'
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      RUST_LOG: 'info'
    ports:
    - '127.0.0.1:8080:8080'
    restart: 'unless-stopped'
  maker-bot:
    # The leader market-maker: polls feeds, composes a fair mid, and drives
    # the relative-quoting hot + cold paths. Funds its leader (keys/EEEE.json)
    # from the localnet faucet over RPC, so it needs no host wallet — only the
    # repo keys/ mount. CMC_API_KEY (host env, optional) arms the CoinMarketCap
    # secondary tier; without it the feed cascades CoinGecko → FX-rate → static.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/bots.Dockerfile'
    command:
    - 'dropset-maker-bot'
    - '--rpc'
    - 'http://host.docker.internal:8899'
    environment:
      CMC_API_KEY: '${CMC_API_KEY:-}'
      RUST_LOG: 'info'
    extra_hosts:
    - 'host.docker.internal:host-gateway'
    restart: 'unless-stopped'
    volumes:
    - '../../keys:/app/keys:ro'
  migrate:
    # The single schema owner (docs/data-feeds.md §8). Run-once, idempotent, and
    # the only thing in the stack that issues DDL: every database-writing
    # service gates on it via `service_completed_successfully`, so no app can
    # start against a schema that does not exist yet.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/migrate.Dockerfile'
    command:
    - 'dropset-migrate'
    depends_on:
      postgres:
        condition: 'service_healthy'
    environment:
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      RUST_LOG: 'info'
    restart: 'no'
  postgres:
    # The one shared `dropset` database: indexer tables, market-data price
    # tables, and the maker go-between tables as they land (docs/data-feeds.md
    # §8).
    #
    # Data is durable, on a named volume. The indexer could always re-sync from
    # chain via its watermark, but the market-data history cannot be
    # reconstructed — a CEX backfill window is finite, so anything that scrolls
    # out of it is gone for good. Recording price history from now on is the
    # point of the collectors, so the volume is what makes a restart cost
    # nothing. `make indexer-down` keeps it; removing it is deliberate
    # (`docker compose down -v`), and re-running `migrate` against the fresh
    # volume replays the whole history.
    environment:
      POSTGRES_DB: 'dropset'
      POSTGRES_PASSWORD: 'dropset'
      POSTGRES_USER: 'dropset'
    healthcheck:
      interval: '5s'
      retries: 10
      test:
      - 'CMD-SHELL'
      - 'pg_isready -U dropset -d dropset'
    image: 'postgres:16-alpine'
    ports:
    - '127.0.0.1:5432:5432'
    restart: 'unless-stopped'
    volumes:
    - 'postgres-data:/var/lib/postgresql/data'
  taker-bot:
    # The benign flow taker: stochastic swaps so the book moves and the maker
    # takes fills. Signs swaps with keys/FFFF.json and mints itself back up to
    # target inventory under the mock-mint authority (keys/BBBB.json, the same
    # committed admin key the host TUI created the mints under) — so, like the
    # maker, it needs only the repo keys/ mount and no host wallet.
    #
    # Opt-in, off by default: the `taker` profile keeps it out of a plain
    # `docker compose up` (and `make bots-up`), so the seeded market stays quiet
    # until the operator explicitly starts it with `make taker-up`. Real takes
    # are operator-driven; this only exists to make localnet books look alive.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/bots.Dockerfile'
    command:
    - 'dropset-taker-bot'
    - '--rpc'
    - 'http://host.docker.internal:8899'
    environment:
      RUST_LOG: 'info'
    extra_hosts:
    - 'host.docker.internal:host-gateway'
    profiles:
    - 'taker'
    restart: 'unless-stopped'
    volumes:
    - '../../keys:/app/keys:ro'
volumes:
  # The shared database's durable storage. Named, so recorded market-data
  # history survives a stack restart (see the `postgres` service). `local` is
  # the default driver, stated explicitly because the lint forbids both an
  # empty value and a flow mapping here.
  #
  # One consequence of persisting: the `postgres` service's POSTGRES_USER /
  # POSTGRES_PASSWORD are applied only when the entrypoint initializes an
  # EMPTY data directory. Before this volume existed the cluster was rebuilt
  # every restart, so those values were always live; now, editing them here
  # silently does nothing while the volume survives, and the mismatch surfaces
  # as an opaque authentication failure. Changing the credentials means
  # `docker compose down -v` (destroying the recorded history) or altering the
  # role in-place inside Postgres.
  postgres-data:
    driver: 'local'
...
