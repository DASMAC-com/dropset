---
# cspell:word healthcheck
# cspell:word isready
# Localnet Docker stack.
#
# Seed service: the Solana Explorer, served on http://localhost:3100 so a
# loopback page reaches the loopback validator RPC without the
# public-site -> localhost block that stalls the hosted explorer. Host port
# 3100 (not 3000) leaves localhost:3000 to the frontend's `next dev`, so the
# explorer and the frontend can run at the same time.
#
# The indexer stack (postgres + indexer + indexer-api) joins this same stack
# (docs/indexer.md §8): the worker polls the host validator for events and
# the api serves /v1 on http://localhost:8080. Bring it up with
# `make indexer-up`.
#
# There is exactly ONE Postgres here, the shared `dropset` database
# (docs/data-feeds.md §8) — on-chain indexer tables, external market-data
# price tables, and the maker go-between tables as they land. The market-data
# collectors used to run their own Postgres in a second compose file; that
# split is gone, because the joins that matter cross it (attributing realized
# PnL means joining indexer fills against external price history at fill
# time). Bring the collectors up with `make collectors-up`.
#
# Grafana rides along with the collectors, serving the provisioned
# market-data dashboard on http://localhost:3200 — the operator's
# view of what the feeds are actually producing (docs/data-feeds.md §8).
# It is a pure reader: it logs in as `dropset_ro` and owns no table.
#
# `migrate` is the one-shot schema gate: `dropset-migrate` owns all DDL and
# every database-writing service waits for it to exit successfully. It is
# idempotent, so it re-runs harmlessly whenever the stack restarts, and
# pointing it at a fresh volume replays the whole history — which is also the
# local reset story.
#
# The maker + taker bots join too (`make bots-up`): both sign with the repo
# `keys/` keypairs bind-mounted in, reach the host-run validator at
# host.docker.internal:8899, and refuse any non-localnet genesis. The host
# validator is intentionally not a service here — the dropset-tui control
# plane owns its lifecycle. Future localnet services join this stack too.
#
# The dropset-tui control plane owns this stack's lifecycle: it brings the
# explorer up in the background at launch and tears it down on quit.
# `make explorer` / `make explorer-down` drive it by hand.
name: 'dropset-localnet'
services:
  alphavantage:
    # The Alpha Vantage daily FX feed. Daily bars only — `FX_INTRADAY` is
    # premium-gated on the free tier — so it corroborates the daily close and
    # cannot stand in for the OANDA anchor (docs/data-feeds.md §9).
    #
    # Keyed, so it sits behind the `fx` profile with the other two: a plain
    # `docker compose up` stays keyless and always works, and `make
    # collectors-up` adds these when the secrets enclave is present.
    #
    # The credential is passed as `${VAR:-}`, NOT the `${VAR:?}` required form,
    # even though the latter would catch a missing key at compose time. The
    # explorer-image workflow runs `docker compose config` over this whole file
    # with no environment at all, purely to read the explorer's `image:` tag —
    # and `:?` fails that parse for every service in the file, so a required
    # credential here breaks an unrelated image build. The collector rejects an
    # empty credential at startup instead, naming the variable.
    #
    # The variable name is derived from the collector's canonical secret name
    # (`alphavantage/api-key`, docs/data-feeds.md §12) rather than chosen here —
    # `make collectors-up` resolves the value from the 1Password enclave and
    # exports it under exactly this spelling. A container never reaches a secret
    # store itself: it has no `op`, and it is handed a resolved value.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/collectors.Dockerfile'
    command:
    - 'market-data-alphavantage'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      ALPHAVANTAGE_API_KEY: '${ALPHAVANTAGE_API_KEY:-}'
      BACKFILL_DAYS: '${BACKFILL_DAYS:-60}'
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      PRODUCT_IDS: >-
        ${ALPHAVANTAGE_PRODUCT_IDS:-${FX_PRODUCT_IDS:-AUD-USD,EUR-USD,GBP-USD}}
      RUST_LOG: 'info'
    profiles:
    - 'fx'
    restart: 'unless-stopped'
  coinbase:
    # The Coinbase reference-price collector: for each roster product, resume
    # from that product's saved cursor, backfill then poll the candles endpoint,
    # and persist closed buckets into `cex_prices`. Keyless — the Coinbase
    # Exchange public REST API needs no credentials — and unrelated to the
    # validator, so it is one of the services here that runs happily with no
    # localnet up at all.
    #
    # Polls every 15s rather than every 60s. That does not change the row rate —
    # 60s is the finest bucket the endpoint offers — but the newest closed
    # bucket lands ~45s sooner instead of up to a minute late, which is what
    # made the series look stale (docs/data-feeds.md §10).
    build:
      context: '../..'
      dockerfile: 'infra/localnet/collectors.Dockerfile'
    command:
    - 'market-data-coinbase'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      BACKFILL_DAYS: '${BACKFILL_DAYS:-60}'
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      PRODUCT_IDS: '${PRODUCT_IDS:-EURC-USDC}'
      RUST_LOG: 'info'
    restart: 'unless-stopped'
  coinbase-ticker:
    # The Coinbase spot-tick collector: poll each roster product's ticker and
    # write the print to `spot_ticks`.
    #
    # This is the service that makes the dashboard's overlay move between candle
    # closes — the candles feed on the same venue cannot, since 60s is the
    # finest bucket its endpoint offers (docs/data-feeds.md §9). Keyless, so it
    # comes up with `make collectors-up`.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/collectors.Dockerfile'
    command:
    - 'market-data-coinbase-ticker'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      POLL_INTERVAL_SECS: '${TICK_POLL_INTERVAL_SECS:-15}'
      PRODUCT_IDS: '${PRODUCT_IDS:-EURC-USDC}'
      RUST_LOG: 'info'
    restart: 'unless-stopped'
  erapi:
    # The er-api daily FX collector: one batched keyless request prices every
    # roster currency into `spot_ticks`, stamped with the provider's own refresh
    # instant rather than the poll second (docs/data-feeds.md §9).
    #
    # It carries the leg no other keyless source does: NGN. Pyth Hermes
    # catalogues that currency but has never published a price for it, and the
    # ECB set behind Frankfurter omits it entirely, so until this service ran
    # it rested on two keyed vendors alone. Keyless, so it comes up with
    # `make collectors-up`.
    #
    # **`POLL_INTERVAL_SECS` is hourly and does NOT read
    # `TICK_POLL_INTERVAL_SECS`.** The other `spot_ticks` collectors poll every
    # 15 s, which for a snapshot refreshed once a day would spend ~5,700 keyless
    # requests a day re-reading a value the provider has already said will not
    # change. The idempotent insert absorbs the redundant polls that remain.
    #
    # **`ERAPI_PRODUCT_IDS` deliberately does not chain to `FX_PRODUCT_IDS`**
    # the way the keyed FX venues do. That shared roster is the three pairs
    # those vendors are paid for; this venue prices its whole table in one
    # request, so narrowing it to that set would discard the coverage that is
    # the only reason to run it.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/collectors.Dockerfile'
    command:
    - 'market-data-erapi'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      POLL_INTERVAL_SECS: '${ERAPI_POLL_INTERVAL_SECS:-3600}'
      PRODUCT_IDS: >-
        ${ERAPI_PRODUCT_IDS:-AUD-USD,BRL-USD,CAD-USD,CHF-USD,EUR-USD,
        GBP-USD,IDR-USD,JPY-USD,MXN-USD,MYR-USD,NGN-USD,SGD-USD,
        TRY-USD,ZAR-USD}
      RUST_LOG: 'info'
    restart: 'unless-stopped'
  explorer:
    # `.github/workflows/explorer-image.yml` builds this image (multi-arch) and
    # pushes it to the `image:` tag below; `pull` / `up` prefer that prebuilt
    # image so a cold localnet doesn't pay the from-source build. This `build:`
    # is the fallback compose uses when the tag can't be pulled (offline, or a
    # freshly-bumped version CI hasn't published yet). The explorer source ref
    # is pinned in explorer.Dockerfile (`ARG EXPLORER_REF`); bump it and the
    # `image:` tag together to cut a new version.
    build:
      context: '.'
      dockerfile: 'explorer.Dockerfile'
    # The explorer reads localnet state client-side (the browser hits the
    # customUrl RPC directly); the host gateway lets any server-side fetch
    # reach a host-run validator at http://host.docker.internal:8899.
    extra_hosts:
    - 'host.docker.internal:host-gateway'
    # The CI-published image localnet pulls. Bump this tag (with EXPLORER_REF
    # in explorer.Dockerfile) in one commit to cut a new version; the workflow
    # publishes it and localnet pulls it instead of building from source.
    image: 'dasmac/dropset-localnet-explorer:v1'
    # Bind to loopback only — a local dev viewer, not a LAN service. Host port
    # 3100 dodges the frontend's localhost:3000; the container serves 3000.
    ports:
    - '127.0.0.1:3100:3000'
    # Prefer a locally-cached image, else pull the tag above; the `build:`
    # falls in only when that pull is unavailable.
    pull_policy: 'missing'
    restart: 'unless-stopped'
  grafana:
    # Data observability over the shared database: the provisioned
    # market-data dashboard (docs/data-feeds.md §8, §12). No
    # producer code — the collectors already write the tables, and this is
    # Grafana OSS as configuration, mounted read-only out of
    # market-data/grafana/ so the repo is the source of truth.
    #
    # Gated on `migrate` for a reason beyond the tables: migration 0002
    # creates the `dropset_ro` role this service logs in as, so starting
    # before it completes would be an authentication failure rather than an
    # empty dashboard.
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    # Every DROPSET_DB_* value is what the provisioning tree interpolates, so
    # the identical tree runs against the cloud host by overriding these and
    # nothing else (§12's stage-1 EC2 box runs this same compose file). The
    # defaults are the local stack. Grafana expands `$VAR` in provisioning
    # files but has no default syntax of its own, which is why the defaults
    # live here rather than there.
    #
    # Anonymous access with the login form off: this is bound to loopback,
    # there is nothing to authorize, and a login prompt in front of a
    # dashboard on a screenshare is pure friction.
    #
    # The anonymous role is `Editor`, not `Viewer`, and that is deliberate.
    # Grafana decides whether a dashboard can be edited from the *requesting*
    # role, so under `Viewer` nobody can tweak a panel — and with the login
    # form off there is no admin to switch to, which would make the intended
    # tweak-then-export loop impossible rather than merely awkward. It also
    # unlocks Explore, which is the natural tool for the ad-hoc "is anyone
    # else quoting this pair" question the coverage panel raises. What bounds
    # the blast radius is not the Grafana role: it is the loopback binding,
    # the `dropset_ro` credentials (an editor still cannot write a table), and
    # the volume-less store, which discards an uncommitted edit when the
    # container is recreated (not on a plain `up`, which leaves a running
    # container alone). Read egress is bounded by the loopback bind rather
    # than by the role: an editor can author an alerting contact point.
    #
    # These three auth settings travel together. `admin`'s password is left
    # at Grafana's default, which is unreachable only while basic auth and
    # the login form are both off — turning either back on exposes it.
    environment:
      DROPSET_DB_HOST: '${DROPSET_DB_HOST:-postgres:5432}'
      DROPSET_DB_NAME: '${DROPSET_DB_NAME:-dropset}'
      DROPSET_DB_PASSWORD: '${DROPSET_DB_PASSWORD:-dropset_ro}'
      DROPSET_DB_SSLMODE: '${DROPSET_DB_SSLMODE:-disable}'
      DROPSET_DB_USER: '${DROPSET_DB_USER:-dropset_ro}'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Editor'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      # Land on the market-data dashboard rather than an empty home page, so
      # `make grafana` opens straight onto the data.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: >-
        /var/lib/grafana/dashboards/market-data.json
      GF_USERS_DEFAULT_THEME: 'dark'
    image: 'grafana/grafana-oss:11.6.0'
    # Loopback only, like the explorer. Host port 3200 keeps clear of the
    # frontend (3000), the explorer (3100), and the indexer API (8080).
    ports:
    - '127.0.0.1:3200:3000'
    restart: 'unless-stopped'
    # No named volume: with the datasource and the dashboards both
    # provisioned, Grafana's own store holds nothing worth keeping, and
    # leaving it ephemeral means a restart can never serve a stale copy of a
    # dashboard the repo has since changed. Every mount is read-only, so a
    # container cannot edit its way out of what is committed.
    #
    # The two provisioning mounts name their own subdirectories rather than
    # the `provisioning/` tree above them, which is deliberate: mounting the
    # parent shadows the image's own `plugins/` and `alerting/` provisioning
    # directories, and Grafana logs a `level=error` line per missing one on
    # every boot. It starts and provisions correctly either way, but a stack
    # whose whole purpose is that the operator trusts what they see cannot
    # afford to open with two errors that do not matter.
    #
    # Long-form syntax because the short `src:dst:ro` form of the two
    # provisioning paths exceeds the repo's 80-column yamllint limit; the
    # dashboards mount would fit, and uses it too so the three read alike.
    volumes:
    - read_only: true
      source: '../../market-data/grafana/dashboards'
      target: '/var/lib/grafana/dashboards'
      type: 'bind'
    - read_only: true
      source: '../../market-data/grafana/provisioning/dashboards'
      target: '/etc/grafana/provisioning/dashboards'
      type: 'bind'
    - read_only: true
      source: '../../market-data/grafana/provisioning/datasources'
      target: '/etc/grafana/provisioning/datasources'
      type: 'bind'
    # The maker's alert rules. This is the third provisioning mount, and it
    # is the reason the comment above insists on naming subdirectories: the
    # image ships its own `alerting/` provisioning directory, so mounting the
    # `provisioning/` parent to add this would shadow it — and shadowing the
    # very directory being provisioned is the one mistake that would look
    # like it worked.
    #
    # Rules provisioned this way evaluate and reach Firing in the Alerting
    # UI, which is what makes them checkable from the stack. They deliver
    # nowhere: no contact point is configured here, on purpose — a real
    # destination needs a secret, and secrets are not committed.
    - read_only: true
      source: '../../market-data/grafana/provisioning/alerting'
      target: '/etc/grafana/provisioning/alerting'
      type: 'bind'
  indexer:
    # Decode + persist + aggregate. Polls the host-run validator's events.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/indexer.Dockerfile'
    command:
    - 'dropset-indexer'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      RPC_URL: 'http://host.docker.internal:8899'
      RUST_LOG: 'info'
    extra_hosts:
    - 'host.docker.internal:host-gateway'
    restart: 'unless-stopped'
  indexer-api:
    # The /v1 REST surface, on loopback http://localhost:8080.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/indexer.Dockerfile'
    command:
    - 'dropset-indexer-api'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      API_BIND: '0.0.0.0:8080'
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      RUST_LOG: 'info'
    ports:
    - '127.0.0.1:8080:8080'
    restart: 'unless-stopped'
  kraken:
    # The Kraken spot-tick collector: one batched public-ticker request prices
    # the whole roster into `spot_ticks` (docs/data-feeds.md §9).
    #
    # It carries the leg no other keyless source does: a real market print of
    # the `USDC/USD` peg — Coinbase Exchange lists no such product and
    # Binance.US quotes an administered flat 1.00. Collecting it is what lets a
    # peg dislocation be read after the fact rather than only watched live. The
    # default roster is the two legs the maker already subscribes to, plus
    # `EURC/EUR` — token against its own fiat, the closest keyless stand-in for
    # an issuer redemption rate. No model leg reads that third pair yet; it is
    # recorded because Kraken's keyless OHLC serves only a rolling window, so
    # tick resolution is unrecoverable afterwards (see the binary's module
    # header).
    #
    # Keyless and batched: one request per poll regardless of roster size, so
    # adding pairs costs nothing and needs no cadence change.
    #
    # `PRODUCT_IDS` holds canonical ids and the collector derives Kraken's
    # spelling by concatenation. A legacy asset that keeps Kraken's `X`/`Z`
    # prefix pins its own spelling with `CANONICAL=VENUE` (e.g.
    # `USDT-USD=USDTZUSD`); a pair Kraken does not recognize is omitted from its
    # response, and the collector reports it as a roster mistake after a few
    # polls rather than leaving it to look like an outage.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/collectors.Dockerfile'
    command:
    - 'market-data-kraken'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      POLL_INTERVAL_SECS: '${TICK_POLL_INTERVAL_SECS:-15}'
      PRODUCT_IDS: '${KRAKEN_PRODUCT_IDS:-USDC-USD,EURC-USD,EURC-EUR}'
      RUST_LOG: 'info'
    restart: 'unless-stopped'
  maker-bot:
    # The leader market-maker: polls feeds, composes a fair mid, and drives
    # the relative-quoting hot + cold paths. Funds its leader (keys/EEEE.json)
    # from the localnet faucet over RPC, so it needs no host wallet — only the
    # repo keys/ mount. Every price feed is keyless, so no secret is passed in.
    #
    # NOTE THE ABSENT `depends_on`, which is a design decision rather than an
    # omission. Every other database-writing service here gates on `migrate`
    # via `service_completed_successfully`; this one must not. The maker's
    # relationship to Postgres is a soft one — it writes operational telemetry
    # and reads nothing back — so gating it would convert a database problem
    # into a *quoting* problem, which is the one outcome the design refuses
    # (db-schema's `require_schema` carries the same rule, and the maker
    # deliberately never calls it).
    #
    # The cost is that a cold `up` can start the bot before the schema
    # exists. That is handled rather than avoided: the telemetry pool is lazy
    # and its sink is best-effort, so the early batches are dropped with a log
    # line and reporting begins on its own once `migrate` has run.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/bots.Dockerfile'
    command:
    - 'dropset-maker-bot'
    - '--rpc'
    - 'http://host.docker.internal:8899'
    environment:
      # Connects as the `dropset` owner, not `dropset_ro`: this is the one
      # maker path that WRITES. Grafana reads the same tables through the
      # read-only role instead (§8's one-writer-per-table rule — the maker
      # owns these three tables and nothing else writes them).
      #
      # Unset this to run the bot with no telemetry at all; it quotes
      # identically either way, which is what makes the dependency soft in
      # practice and not just in principle.
      DROPSET_DATABASE_URL: >-
        ${DROPSET_DATABASE_URL:-postgres://dropset:dropset@postgres:5432/dropset}
      RUST_LOG: 'info'
    extra_hosts:
    - 'host.docker.internal:host-gateway'
    restart: 'unless-stopped'
    volumes:
    - '../../keys:/app/keys:ro'
  migrate:
    # The single schema owner (docs/data-feeds.md §8). Run-once, idempotent, and
    # the only thing in the stack that issues DDL: every database-writing
    # service gates on it via `service_completed_successfully`, so no app can
    # start against a schema that does not exist yet.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/migrate.Dockerfile'
    command:
    - 'dropset-migrate'
    depends_on:
      postgres:
        condition: 'service_healthy'
    environment:
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      RUST_LOG: 'info'
    restart: 'no'
  oanda:
    # The OANDA v20 FX anchor feed: minute bars with real tick volume, a
    # per-candle `complete` flag, and history reaching back years
    # (docs/data-feeds.md §9). The deepest and freshest of the three FX sources.
    #
    # A weekend window legitimately returns no candles — real FX is closed — and
    # the adapter advances its cursor past the window anyway, so an idle
    # Saturday is not a stall.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/collectors.Dockerfile'
    command:
    - 'market-data-oanda'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      BACKFILL_DAYS: '${BACKFILL_DAYS:-60}'
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      OANDA_API_KEY: '${OANDA_API_KEY:-}'
      PRODUCT_IDS: >-
        ${OANDA_PRODUCT_IDS:-${FX_PRODUCT_IDS:-AUD-USD,EUR-USD,GBP-USD}}
      RUST_LOG: 'info'
    profiles:
    - 'fx'
    restart: 'unless-stopped'
  postgres:
    # The one shared `dropset` database: indexer tables, market-data price
    # tables, and the maker go-between tables as they land (docs/data-feeds.md
    # §8).
    #
    # Data is durable, on a named volume. The indexer could always re-sync from
    # chain via its watermark, but the market-data history cannot be
    # reconstructed — a CEX backfill window is finite, so anything that scrolls
    # out of it is gone for good. Recording price history from now on is the
    # point of the collectors, so the volume is what makes a restart cost
    # nothing. `make indexer-down` keeps it; removing it is deliberate
    # (`docker compose down -v`), and re-running `migrate` against the fresh
    # volume replays the whole history.
    environment:
      POSTGRES_DB: 'dropset'
      POSTGRES_PASSWORD: 'dropset'
      POSTGRES_USER: 'dropset'
    healthcheck:
      interval: '5s'
      retries: 10
      test:
      - 'CMD-SHELL'
      - 'pg_isready -U dropset -d dropset'
    image: 'postgres:16-alpine'
    ports:
    - '127.0.0.1:5432:5432'
    restart: 'unless-stopped'
    volumes:
    - 'postgres-data:/var/lib/postgresql/data'
  pyth:
    # The Pyth Hermes FX tick collector: one batched request prices every cross
    # on the roster into `spot_ticks`, with the publisher's confidence
    # half-width (docs/data-feeds.md §9).
    #
    # This is the FX tier that publishes a confidence alongside its rate, which
    # is why it outranks the daily fallbacks — and why storing it matters: a
    # rate whose uncertainty was not recorded cannot later be told apart from
    # one that was firm.
    #
    # **It takes no `PRODUCT_IDS`.** Its roster is reference data in the shared
    # database (`pyth_fx_feeds`, seeded by the migration): a Pyth feed is
    # addressed by a 32-byte hex id that no rule derives from a product id — and
    # because post-gate these collectors run on ECS, which offers environment
    # variables but no way to mount a configuration file. Adding a cross is an
    # INSERT plus a restart of this service; the roster is read once at startup
    # and every row is logged, so the effective set is legible without querying
    # the database it came from.
    #
    # Batched: one request per poll for the whole roster. Keyed since
    # 2026-08-26, when the Pyth Core upgrade put Hermes behind a bearer token.
    #
    # **Opt-in, off by default**, which is why the `pyth` profile keeps it out
    # of a plain `docker compose up` and out of `make collectors-up`. Pyth
    # sells no usable free API tier (docs/data-feeds.md §9), so in practice
    # nobody running this stack holds a key. Left in the default set the
    # service would exit at startup and restart forever, and a permanently
    # crash-looping container teaches operators to ignore a red container,
    # which is the habit that let the original outage run for a week.
    #
    # To start it once a key IS held: uncomment PYTH_API_KEY in your
    # secrets.local.env (it ships commented out, because a reference to a
    # vault item you do not have can fail the whole enclave), then go through
    # `op run` the way the keyed collectors do. A bare
    # `docker compose --profile pyth up pyth` runs outside the enclave, so
    # PYTH_API_KEY interpolates to empty from the ambient shell and the
    # container exits naming it:
    #
    #   op run --env-file=infra/localnet/secrets.local.env -- \
    #     docker compose -f infra/localnet/docker-compose.yml \
    #     --profile pyth up pyth
    build:
      context: '../..'
      dockerfile: 'infra/localnet/collectors.Dockerfile'
    command:
    - 'market-data-pyth'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      POLL_INTERVAL_SECS: '${TICK_POLL_INTERVAL_SECS:-15}'
      # Required since the Pyth Core upgrade of 2026-08-26 put Hermes behind a
      # bearer token. Empty, the collector names this variable and exits at
      # startup rather than polling into a 401 — the failure has to be a
      # process that dies, because the one that stayed up wrote nothing for a
      # week and looked healthy throughout.
      PYTH_API_KEY: '${PYTH_API_KEY:-}'
      RUST_LOG: 'info'
    profiles:
    - 'pyth'
    restart: 'unless-stopped'
  taker-bot:
    # The benign flow taker: stochastic swaps so the book moves and the maker
    # takes fills. Signs swaps with keys/FFFF.json and mints itself back up to
    # target inventory under the mock-mint authority (keys/BBBB.json, the same
    # committed admin key the host TUI created the mints under) — so, like the
    # maker, it needs only the repo keys/ mount and no host wallet.
    #
    # Opt-in, off by default: the `taker` profile keeps it out of a plain
    # `docker compose up` (and `make bots-up`), so the seeded market stays quiet
    # until the operator explicitly starts it with `make taker-up`. Real takes
    # are operator-driven; this only exists to make localnet books look alive.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/bots.Dockerfile'
    command:
    - 'dropset-taker-bot'
    - '--rpc'
    - 'http://host.docker.internal:8899'
    environment:
      RUST_LOG: 'info'
    extra_hosts:
    - 'host.docker.internal:host-gateway'
    profiles:
    - 'taker'
    restart: 'unless-stopped'
    volumes:
    - '../../keys:/app/keys:ro'
  twelvedata:
    # The Twelve Data FX cross-check: an independent minute-bar opinion for the
    # fusion estimator to disagree with (docs/data-feeds.md §9).
    #
    # Two things to know about its rows. It publishes no volume, so they carry
    # `0.0` — never compare volume across sources. And it publishes a complete
    # minute grid on weekends where OANDA publishes nothing, so session
    # detection reads bar absence from OANDA rather than trusting either alone.
    #
    # Its 300-second tick is sized to 800 credits/day with headroom; that does
    # not coarsen the bars, since one request returns a window of them. With a
    # roster the collector widens that interval itself so the pairs together
    # stay inside the same daily budget, and logs the effective value.
    build:
      context: '../..'
      dockerfile: 'infra/localnet/collectors.Dockerfile'
    command:
    - 'market-data-twelvedata'
    depends_on:
      migrate:
        condition: 'service_completed_successfully'
    environment:
      BACKFILL_DAYS: '${BACKFILL_DAYS:-60}'
      DATABASE_URL: 'postgres://dropset:dropset@postgres:5432/dropset'
      PRODUCT_IDS: >-
        ${TWELVEDATA_PRODUCT_IDS:-${FX_PRODUCT_IDS:-AUD-USD,EUR-USD,GBP-USD}}
      RUST_LOG: 'info'
      TWELVEDATA_API_KEY: '${TWELVEDATA_API_KEY:-}'
    profiles:
    - 'fx'
    restart: 'unless-stopped'
volumes:
  # The shared database's durable storage. Named, so recorded market-data
  # history survives a stack restart (see the `postgres` service). `local` is
  # the default driver, stated explicitly because the lint forbids both an
  # empty value and a flow mapping here.
  #
  # One consequence of persisting: the `postgres` service's POSTGRES_USER /
  # POSTGRES_PASSWORD are applied only when the entrypoint initializes an
  # EMPTY data directory. Before this volume existed the cluster was rebuilt
  # every restart, so those values were always live; now, editing them here
  # silently does nothing while the volume survives, and the mismatch surfaces
  # as an opaque authentication failure. Changing the credentials means
  # `docker compose down -v` (destroying the recorded history) or altering the
  # role in-place inside Postgres.
  postgres-data:
    driver: 'local'
...
