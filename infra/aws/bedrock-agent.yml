---
AWSTemplateFormatVersion: '2010-09-09'
Conditions:
  HasBudgetAlertEmail: !Not
  - !Equals
    - !Ref 'BudgetAlertEmail'
    - ''
  IsSpendKillSwitchEnabled: !Equals
  - !Ref 'SpendKillSwitchEnabled'
  - 'true'
Description: >-
  Dropset Bedrock agent identity: the IAM user that backs the long-term
  Amazon Bedrock API key used by agent sessions, a managed policy scoped to
  model invocation alone, a daily spend cap that warns and then blocks
  invocation when a rolling 24-hour estimate from Bedrock token metrics
  reaches its limit, and an optional monthly spend ALERT that fires once
  uncredited spend reaches its threshold - a coarse tripwire, not a prompt
  signal that credit coverage lapsed. No credential value is created or
  stored by this template - the API key is minted out of band and kept in
  1Password (see infra/aws/README.md). The identity is model-agnostic: it is
  shared by every role's Bedrock sessions, and which model a session runs is
  launcher runtime config, never a stack value.
Outputs:
  BedrockAgentPolicyArn:
    Description: 'ARN of the invoke-only managed policy.'
    Export:
      Name: !Sub '${EnvironmentName}-bedrock-agent-policy-arn'
    Value: !Ref 'BedrockAgentInvokePolicy'
  BedrockAgentUserName:
    Description: >-
      Name of the IAM user the long-term Bedrock API key is minted against.
    Export:
      Name: !Sub '${EnvironmentName}-bedrock-agent-user'
    Value: !Ref 'BedrockAgentUser'
Parameters:
  BudgetAlertEmail:
    Default: ''
    Description: >-
      Address the monthly spend alert and the daily spend-cap alarms notify.
      Entered by the operator at deploy time and never committed, which is
      why the committed parameter file omits it - a redeploy then keeps the
      previous value rather than wiping it. Left empty, no budget is created
      at all, because a budget with an undeliverable subscriber is a tripwire
      that silently never fires, and the spend-cap topic gets no subscriber;
      the kill switch works either way.
    Type: 'String'
  BudgetLimitUsd:
    Default: '10000'
    Description: >-
      Monthly USD threshold for the spend alert. This budget only ALERTS: it
      carries no budget action, so it never stops spend, although Budgets
      could through an action that applies a deny policy. Its billing data
      also lags by up to a day, which is why the hard stop is the daily
      spend cap (SpendCapUsd) instead. At the ratified 10000 it is a runaway
      alarm, not a fine-grained signal that credit coverage lapsed.
    Type: 'String'
  EnvironmentName:
    Default: 'dropset'
    Description: >-
      Name prefix applied to resource names, tags, and exports. This stack
      deliberately passes a BARE 'dropset' where the sibling stacks pass
      'dropset-dev': the ratified agent names carry no environment segment
      (dropset-bedrock-agent, not dropset-dev-bedrock-agent), and reusing
      the shared prefix mechanism to produce them keeps one idiom across
      every template rather than hard-coding literals in this one. The
      divergence is a decision, not drift - see docs/conventions/aws-infra.md.
    Type: 'String'
  SpendCapUsd:
    Default: 2000
    Description: >-
      Rolling 24-hour USD cap on ESTIMATED Bedrock spend. Warnings fire at
      25, 50 and 75 percent of it; at 100 percent the kill switch attaches
      the deny policy to the agent user. The estimate prices every model
      at the TokenRate parameters, so it is an upper bound on the real
      charge ONLY while those are the rates of the dearest model in use - a
      pricier model left running is under-counted (measured: Opus 5 traffic
      priced at Opus 5.5 rates estimated 162 against 210 billed).
    MinValue: 1
    Type: 'Number'
  SpendKillSwitchEnabled:
    AllowedValues:
    - 'false'
    - 'true'
    Default: 'true'
    Description: >-
      Whether reaching SpendCapUsd blocks invocation. Set to false to disarm
      the kill switch while keeping every warning; nothing else changes.
    Type: 'String'
  TokenRateCacheRead:
    Default: 0.22
    Description: 'USD per million cache-read input tokens (Opus 5.5).'
    Type: 'Number'
  TokenRateCacheWrite:
    Default: 8.80
    Description: >-
      USD per million cache-write input tokens (Opus 5.5, 1-hour cache - the
      dearer of the two cache lifetimes, keeping the estimate an upper bound).
    Type: 'Number'
  TokenRateInput:
    Default: 4.40
    Description: 'USD per million uncached input tokens (Opus 5.5).'
    Type: 'Number'
  TokenRateOutput:
    Default: 22.00
    Description: 'USD per million output tokens (Opus 5.5).'
    Type: 'Number'
Resources:
  AgentSpendAlertBudget:
    Condition: 'HasBudgetAlertEmail'
    Properties:
      Budget:
        BudgetLimit:
          Amount: !Ref 'BudgetLimitUsd'
          Unit: 'USD'
        BudgetName: !Sub '${EnvironmentName}-bedrock-agent-spend'
        BudgetType: 'COST'
        CostTypes:
          # Every flag here is at its AWS default except IncludeRefund, which
          # is off so a late refund cannot retroactively pull a month back
          # under a threshold that already alerted. IncludeCredit being on is
          # what makes this track spend NET of credits - the whole point,
          # since while credits cover the charge the figure stays near zero.
          IncludeCredit: true
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: false
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false
        TimeUnit: 'MONTHLY'
      NotificationsWithSubscribers:
      - Notification:
          ComparisonOperator: 'GREATER_THAN'
          NotificationType: 'ACTUAL'
          Threshold: 80
          ThresholdType: 'PERCENTAGE'
        Subscribers:
        - Address: !Ref 'BudgetAlertEmail'
          SubscriptionType: 'EMAIL'
      - Notification:
          ComparisonOperator: 'GREATER_THAN'
          NotificationType: 'FORECASTED'
          Threshold: 100
          ThresholdType: 'PERCENTAGE'
        Subscribers:
        - Address: !Ref 'BudgetAlertEmail'
          SubscriptionType: 'EMAIL'
    Type: 'AWS::Budgets::Budget'
  BedrockAgentInvokePolicy:
    Properties:
      # NOTE: Description is IMMUTABLE on AWS::IAM::ManagedPolicy. Editing it
      # forces a replacement, which collides with the explicit
      # ManagedPolicyName below and fails the update with AlreadyExists unless
      # the name changes too. Change the policy document freely - that updates
      # in place - but treat this text as costing a rename to edit, and so
      # keep it free of details that date. (The worker-to-agent rename was
      # exactly such an edit, and it was free only because the name changed
      # in the same deploy.)
      Description: >-
        Invoke access to any Bedrock foundation model, but only in the US
        regions, through cross-region inference profiles - plus the bearer
        token auth gate an API key needs and the two read-only
        profile-discovery calls. Deliberately excludes every management
        action, including the account data-retention setting: an agent must
        not be able to change the retention posture it runs under.
      ManagedPolicyName: !Sub '${EnvironmentName}-bedrock-invoke'
      PolicyDocument:
        Statement:
        - Action: 'bedrock:CallWithBearerToken'
          Effect: 'Allow'
          Resource: '*'
          Sid: 'AuthenticateWithApiKey'
        - Action: 'bedrock:ListInferenceProfiles'
          Effect: 'Allow'
          Resource: '*'
          Sid: 'DiscoverInferenceProfiles'
        # The MODEL dimension is deliberately left open so models can be
        # swapped without a redeploy (operator decision). The REGION dimension
        # stays pinned to us-*, which is a separate axis and load-bearing:
        # it keeps inference on US soil, and data retention is configured
        # PER REGION and follows the DESTINATION region. Note us-* is a
        # prefix match, so it NARROWS TO BUT DOES NOT EQUAL the three
        # regions opted in (us-east-1, us-east-2, us-west-2) - us-west-1
        # matches too. A bare * would additionally let a global. profile
        # route to a region-less destination this account never opted in.
        # Spend is guarded on the cost side, not here.
        - Action:
          - 'bedrock:GetInferenceProfile'
          - 'bedrock:InvokeModel'
          - 'bedrock:InvokeModelWithResponseStream'
          Effect: 'Allow'
          Resource: !Sub >-
            arn:aws:bedrock:us-*:${AWS::AccountId}:inference-profile/*
          Sid: 'InvokeAnyInferenceProfileInUsRegions'
        - Action:
          - 'bedrock:InvokeModel'
          - 'bedrock:InvokeModelWithResponseStream'
          Effect: 'Allow'
          Resource: 'arn:aws:bedrock:us-*::foundation-model/*'
          Sid: 'InvokeAnyFoundationModelInUsRegions'
        Version: '2012-10-17'
    Type: 'AWS::IAM::ManagedPolicy'
  BedrockAgentUser:
    Properties:
      ManagedPolicyArns:
      - !Ref 'BedrockAgentInvokePolicy'
      Tags:
      - Key: 'Name'
        Value: !Sub '${EnvironmentName}-bedrock-agent'
      UserName: !Sub '${EnvironmentName}-bedrock-agent'
    Type: 'AWS::IAM::User'
  # The three warning alarms and the kill alarm share one metric-math
  # estimate, repeated per alarm because CloudFormation has no way to share
  # it: the four Bedrock token metrics WITHOUT the ModelId dimension (so
  # every model counts, the Sonnet permission classifier included), summed
  # over a 24-hour period, priced at the TokenRate parameters, and expressed
  # as a percentage of SpendCapUsd. One 86400-second period is a SLIDING
  # window re-evaluated every minute - a true rolling 24 hours, not a UTC
  # day. The metrics are per region, so this covers invocations made from
  # the region the stack is deployed in.
  SpendAlarm25:
    Properties:
      AlarmActions:
      - !Ref 'SpendAlertTopic'
      AlarmDescription: >-
        Estimated Bedrock spend over the last 24 hours reached 25 percent of
        the daily spend cap.
      AlarmName: !Sub '${EnvironmentName}-bedrock-spend-25pct'
      ComparisonOperator: 'GreaterThanOrEqualToThreshold'
      DatapointsToAlarm: 1
      EvaluationPeriods: 1
      Metrics:
      - Expression: !Sub >-
          100 * (FILL(input, 0) * ${TokenRateInput}
          + FILL(output, 0) * ${TokenRateOutput}
          + FILL(cache_read, 0) * ${TokenRateCacheRead}
          + FILL(cache_write, 0) * ${TokenRateCacheWrite})
          / 1000000 / ${SpendCapUsd}
        Id: 'pct'
        Label: 'Estimated 24h spend, percent of cap'
        ReturnData: true
      - Id: 'input'
        MetricStat:
          Metric:
            MetricName: 'InputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'output'
        MetricStat:
          Metric:
            MetricName: 'OutputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'cache_read'
        MetricStat:
          Metric:
            MetricName: 'CacheReadInputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'cache_write'
        MetricStat:
          Metric:
            MetricName: 'CacheWriteInputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      Threshold: 25
      TreatMissingData: 'notBreaching'
    Type: 'AWS::CloudWatch::Alarm'
  SpendAlarm50:
    Properties:
      AlarmActions:
      - !Ref 'SpendAlertTopic'
      AlarmDescription: >-
        Estimated Bedrock spend over the last 24 hours reached 50 percent of
        the daily spend cap.
      AlarmName: !Sub '${EnvironmentName}-bedrock-spend-50pct'
      ComparisonOperator: 'GreaterThanOrEqualToThreshold'
      DatapointsToAlarm: 1
      EvaluationPeriods: 1
      Metrics:
      - Expression: !Sub >-
          100 * (FILL(input, 0) * ${TokenRateInput}
          + FILL(output, 0) * ${TokenRateOutput}
          + FILL(cache_read, 0) * ${TokenRateCacheRead}
          + FILL(cache_write, 0) * ${TokenRateCacheWrite})
          / 1000000 / ${SpendCapUsd}
        Id: 'pct'
        Label: 'Estimated 24h spend, percent of cap'
        ReturnData: true
      - Id: 'input'
        MetricStat:
          Metric:
            MetricName: 'InputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'output'
        MetricStat:
          Metric:
            MetricName: 'OutputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'cache_read'
        MetricStat:
          Metric:
            MetricName: 'CacheReadInputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'cache_write'
        MetricStat:
          Metric:
            MetricName: 'CacheWriteInputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      Threshold: 50
      TreatMissingData: 'notBreaching'
    Type: 'AWS::CloudWatch::Alarm'
  SpendAlarm75:
    Properties:
      AlarmActions:
      - !Ref 'SpendAlertTopic'
      AlarmDescription: >-
        Estimated Bedrock spend over the last 24 hours reached 75 percent of
        the daily spend cap.
      AlarmName: !Sub '${EnvironmentName}-bedrock-spend-75pct'
      ComparisonOperator: 'GreaterThanOrEqualToThreshold'
      DatapointsToAlarm: 1
      EvaluationPeriods: 1
      Metrics:
      - Expression: !Sub >-
          100 * (FILL(input, 0) * ${TokenRateInput}
          + FILL(output, 0) * ${TokenRateOutput}
          + FILL(cache_read, 0) * ${TokenRateCacheRead}
          + FILL(cache_write, 0) * ${TokenRateCacheWrite})
          / 1000000 / ${SpendCapUsd}
        Id: 'pct'
        Label: 'Estimated 24h spend, percent of cap'
        ReturnData: true
      - Id: 'input'
        MetricStat:
          Metric:
            MetricName: 'InputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'output'
        MetricStat:
          Metric:
            MetricName: 'OutputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'cache_read'
        MetricStat:
          Metric:
            MetricName: 'CacheReadInputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'cache_write'
        MetricStat:
          Metric:
            MetricName: 'CacheWriteInputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      Threshold: 75
      TreatMissingData: 'notBreaching'
    Type: 'AWS::CloudWatch::Alarm'
  SpendAlertSubscription:
    Condition: 'HasBudgetAlertEmail'
    Properties:
      # Email subscriptions start PENDING: AWS mails a confirmation link,
      # and nothing is delivered until it is clicked.
      Endpoint: !Ref 'BudgetAlertEmail'
      Protocol: 'email'
      TopicArn: !Ref 'SpendAlertTopic'
    Type: 'AWS::SNS::Subscription'
  SpendAlertTopic:
    Properties:
      TopicName: !Sub '${EnvironmentName}-bedrock-spend-alerts'
    Type: 'AWS::SNS::Topic'
  SpendCapDenyPolicy:
    Properties:
      # Description is IMMUTABLE here too - see BedrockAgentInvokePolicy.
      Description: >-
        Denies Bedrock model invocation, and the API-key auth gate, to the
        agent identity. Attached by the spend-cap kill switch; detached by
        hand to resume. An explicit deny overrides the invoke allow, and the
        agent holds no IAM permission to remove it.
      ManagedPolicyName: !Sub '${EnvironmentName}-bedrock-spend-cap-deny'
      PolicyDocument:
        Statement:
        - Action:
          - 'bedrock:CallWithBearerToken'
          - 'bedrock:InvokeModel'
          - 'bedrock:InvokeModelWithResponseStream'
          Effect: 'Deny'
          Resource: '*'
          Sid: 'DenyInvocationWhileSpendCapTripped'
        Version: '2012-10-17'
    Type: 'AWS::IAM::ManagedPolicy'
  SpendKillAlarm:
    Properties:
      # Disarming drops only the Lambda action: the alarm still emails.
      AlarmActions: !If
      - 'IsSpendKillSwitchEnabled'
      - - !Ref 'SpendAlertTopic'
        - !GetAtt 'SpendKillFunction.Arn'
      - - !Ref 'SpendAlertTopic'
      AlarmDescription: >-
        Estimated Bedrock spend over the last 24 hours reached the daily
        spend cap. When the kill switch is armed, the deny policy is now
        attached to the agent user - see infra/aws/README.md to resume.
      AlarmName: !Sub '${EnvironmentName}-bedrock-spend-cap'
      ComparisonOperator: 'GreaterThanOrEqualToThreshold'
      DatapointsToAlarm: 1
      EvaluationPeriods: 1
      Metrics:
      - Expression: !Sub >-
          100 * (FILL(input, 0) * ${TokenRateInput}
          + FILL(output, 0) * ${TokenRateOutput}
          + FILL(cache_read, 0) * ${TokenRateCacheRead}
          + FILL(cache_write, 0) * ${TokenRateCacheWrite})
          / 1000000 / ${SpendCapUsd}
        Id: 'pct'
        Label: 'Estimated 24h spend, percent of cap'
        ReturnData: true
      - Id: 'input'
        MetricStat:
          Metric:
            MetricName: 'InputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'output'
        MetricStat:
          Metric:
            MetricName: 'OutputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'cache_read'
        MetricStat:
          Metric:
            MetricName: 'CacheReadInputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      - Id: 'cache_write'
        MetricStat:
          Metric:
            MetricName: 'CacheWriteInputTokenCount'
            Namespace: 'AWS/Bedrock'
          Period: 86400
          Stat: 'Sum'
        ReturnData: false
      Threshold: 100
      TreatMissingData: 'notBreaching'
    Type: 'AWS::CloudWatch::Alarm'
  SpendKillFunction:
    Properties:
      Code:
        # Alarm actions fire only on the transition INTO the alarm state,
        # so this runs once per trip; attaching an already-attached policy
        # is a no-op, which makes a re-trip harmless. The code is written
        # flat - a one-line def, its call continued inside parentheses -
        # because the repo's yamllint rejects any line indented deeper than
        # the block scalar's first.
        ZipFile: |
          import os
          import boto3
          IAM = boto3.client('iam')
          def handler(event, context): IAM.attach_user_policy(
          UserName=os.environ['USER_NAME'], PolicyArn=os.environ['POLICY_ARN'])
      Description: >-
        Attaches the spend-cap deny policy to the Bedrock agent user.
      Environment:
        Variables:
          POLICY_ARN: !Ref 'SpendCapDenyPolicy'
          USER_NAME: !Ref 'BedrockAgentUser'
      Handler: 'index.handler'
      Role: !GetAtt 'SpendKillFunctionRole.Arn'
      Runtime: 'python3.13'
      Timeout: 30
    Type: 'AWS::Lambda::Function'
  SpendKillFunctionPermission:
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref 'SpendKillFunction'
      Principal: 'lambda.alarms.cloudwatch.amazonaws.com'
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !GetAtt 'SpendKillAlarm.Arn'
    Type: 'AWS::Lambda::Permission'
  SpendKillFunctionRole:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: 'sts:AssumeRole'
          Effect: 'Allow'
          Principal:
            Service: 'lambda.amazonaws.com'
        Version: '2012-10-17'
      ManagedPolicyArns:
      - !Sub >-
               arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyDocument:
          Statement:
          # Scoped to exactly one user and one policy: the function can
          # attach the deny policy and nothing else, anywhere.
          - Action: 'iam:AttachUserPolicy'
            Condition:
              ArnEquals:
                iam:PolicyARN: !Ref 'SpendCapDenyPolicy'
            Effect: 'Allow'
            Resource: !GetAtt 'BedrockAgentUser.Arn'
          Version: '2012-10-17'
        PolicyName: 'attach-spend-cap-deny'
    Type: 'AWS::IAM::Role'
...
