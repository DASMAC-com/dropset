# The single authoritative Rust version for this workspace: CI, local
# development, and the Docker images all resolve the compiler from here.
#
# Why this file exists. CI used to resolve `dtolnay/rust-toolchain@stable`,
# which floats. On 2026-08-20 clippy 1.98 shipped a new lint
# (`chunks_exact_to_as_chunks`), the lint workflow runs clippy with
# `-D warnings`, and main went red with no code change — blocking the merge
# queue for every open PR. A floating channel means any compiler release can
# do that again, so the channel is pinned and moves only in a deliberate
# bump PR.
#
# `components` is listed even though rustup's default profile already carries
# clippy and rustfmt, and even though only the lint gate actually runs them.
# The reason is cache identity, not installation. Swatinem/rust-cache hashes
# the installed toolchain into its cache key, so while the lint job was the
# only one adding these two components it computed a different hash from every
# other Rust job and could never share their cache entry — it maintained a
# duplicate ~0.6 GB copy per ref instead. Declaring the components here makes
# every job's toolchain identical, which is what lets the lint and SDK jobs
# point at the test jobs' `shared-key`. See docs/ci.md.
#
# Targets are deliberately NOT listed here. Installed targets do not enter the
# rust-cache key — measured: the SDK job installs the wasm32 target and still
# hashed identically to the jobs that do not — so the wasm32 target stays
# declared in the SDK workflow rather than being downloaded by all six jobs.
#
# Bumping this is a reviewed diff, never a surprise: run the full-workspace
# `cargo clippy --all-targets -- -D warnings` locally first, so new-lint churn
# arrives as a PR rather than as a red main. See docs/ci.md.

[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
