# cspell:word rustls
# Prototype off-chain event indexer for the Dropset eCLOB (docs/indexer.md).
# Subscribes to the program's `emit_cpi!` events, decodes them with the
# shared `dropset_sdk::events` codec, persists raw legs under the frozen
# `(slot, txn_index, signature, event_ordinal)` key, derives take-level and
# inventory rollups in a watermarked worker, and serves the `/v1` REST
# surface (interface.md §5). Two binaries: `dropset-indexer` (ingest +
# aggregate) and `dropset-indexer-api` (the `/v1` server).

[[bin]]
name = "dropset-indexer"
path = "src/bin/indexer.rs"

[[bin]]
name = "dropset-indexer-api"
path = "src/bin/api.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
# The single schema owner. The indexer's tables moved into its migrations, so
# this dependency is what lets `Store::connect` assert the schema instead of
# creating it.
dropset-db-schema = { path = "../db-schema" }
# The shared ingestion framework (docs/data-feeds.md §6): the indexer runs on
# its RPC poll source, store sink, and `feed_cursors` resume cursor, and keeps
# only its own writers, aggregator, and `/v1`. The RPC transport lives there
# now, which is why this crate no longer depends on solana-client, bs58, or
# the transaction-status types directly.
dropset-feeds = { path = "../feeds", features = ["rpc", "store"] }
# The shared event decoder (`dropset_sdk::events`). Same 3.x solana line as
# the maker-bot so there is one `Pubkey` type across decode and RPC.
dropset-sdk = { path = "../sdk/rs", features = ["fetch"] }
rust_decimal = { version = "1", features = ["db-postgres", "serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-pubkey = "3"
# String-typed runtime queries (no compile-time `DATABASE_URL`, and no
# `migrate`: DDL belongs to `dropset-db-schema`); `rust_decimal` maps u64 atoms
# onto Postgres NUMERIC without the i64 truncation a BIGINT bind would risk.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
  "rust_decimal",
  "json",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Build tagged event bytes in the decode unit test and the store tests.
borsh = { version = "1", features = ["derive"] }
# The store path is exercised against a real Postgres in a throwaway
# container (indexer/tests/store_postgres.rs), provisioned through
# `dropset-db-schema` the way a deployment is. Those tests need a Docker
# daemon, so they are `#[ignore]`d; the `Postgres` CI job runs them with
# `--run-ignored all`.
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
description = "Prototype event indexer for the Dropset eCLOB program."
name = "dropset-indexer"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
